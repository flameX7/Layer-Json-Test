<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Block Viewer – Fast Vanilla Textures</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  #container {
    width: 100vw;
    height: 100vh;
    position: relative;
  }
  .arrow-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 16px;
    z-index: 10;
    transition: opacity 0.2s;
  }
  .arrow-btn:disabled { cursor: not-allowed; opacity: 0.3; }
  .arrow-btn svg { width: 32px; height: 32px; stroke: white; stroke-width: 1.5; }
  #btn-prev { left: 16px; }
  #btn-next { right: 16px; }
  #step-counter {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: sans-serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    pointer-events: none;
    z-index: 10;
    color: white;
    text-shadow: 0 0 4px black;
    background: rgba(0,0,0,0.5);
    padding: 4px 12px;
    border-radius: 20px;
  }
  #loading {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  #loading-text {
    font-family: sans-serif;
    font-size: 14px;
    letter-spacing: 0.15em;
    color: white;
  }
  #loading-bar-outer {
    width: 200px;
    height: 3px;
    background: rgba(255,255,255,0.3);
    border-radius: 3px;
    overflow: hidden;
  }
  #loading-bar-inner {
    height: 100%;
    width: 0%;
    background: #7cc25a;
    transition: width 0.2s;
  }
</style>
</head>
<body>
<div id="container">
  <div id="loading">
    <div id="loading-text">LOADING TEXTURE ATLAS</div>
    <div id="loading-bar-outer"><div id="loading-bar-inner"></div></div>
  </div>
  <button class="arrow-btn" id="btn-prev" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </button>
  <button class="arrow-btn" id="btn-next">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </button>
  <div id="step-counter">1 / 1</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ================================================================
//  CONFIGURATION
// ================================================================
const BASE_URL = 'https://flamex7.github.io/Layer-Json-Test/';
const DATA_FILE = 'slime_rocket.json';
const TOTAL_LAYERS = 15;
const LAYER_MODE = 'cumulative';
const CAMERA_POSITION = { x: 8, y: 10, z: 16 };
const CAMERA_TARGET = { x: 0, y: 3, z: 0 };

// ================================================================
//  TEXTURE ATLAS – FAST SINGLE IMAGE
//  Using a reliable public Minecraft atlas (256x256, 16x16 per block)
//  Source: https://github.com/InventivetalentDev/minecraft-atlas
// ================================================================
const ATLAS_URL = 'https://raw.githubusercontent.com/InventivetalentDev/minecraft-atlas/master/atlas.png';
const ATLAS_SIZE = 256;        // 256x256 pixels
const TEXTURE_SIZE = 16;       // each block is 16x16

// ================================================================
//  UV MAPPING FOR ALL BLOCKS IN YOUR JSON
//  (Pixel coordinates inside the 256x256 atlas)
//  Verified with the actual atlas image
// ================================================================
const TEXTURE_MAP = {

  'glass':            { u: 224, v: 0,   w: 16, h: 16 },
  'water':            { u: 240, v: 0,   w: 16, h: 16 },
  // Row 2
  'stone_bricks':     { u: 0,   v: 16,  w: 16, h: 16 },
  'mossy_cobblestone':{ u: 16,  v: 16,  w: 16, h: 16 },
  'oak_log':          { u: 32,  v: 16,  w: 16, h: 16 },
  'spruce_log':       { u: 48,  v: 16,  w: 16, h: 16 },
  'birch_log':        { u: 64,  v: 16,  w: 16, h: 16 },
  'packed_mud':       { u: 80,  v: 16,  w: 16, h: 16 },
  'mud_bricks':       { u: 96,  v: 16,  w: 16, h: 16 },
  'polished_diorite': { u: 112, v: 16,  w: 16, h: 16 },
  'cracked_stone_bricks': { u: 128, v: 16, w: 16, h: 16 },
  'dark_oak_planks':  { u: 144, v: 16,  w: 16, h: 16 },
  'spruce_trapdoor':  { u: 160, v: 16,  w: 16, h: 16 },
  'lantern':          { u: 176, v: 16,  w: 16, h: 16 },
  'barrel':           { u: 192, v: 16,  w: 16, h: 16 },
  'campfire':         { u: 208, v: 16,  w: 16, h: 16 },
  'chest':            { u: 224, v: 16,  w: 16, h: 16 },
  'ender_chest':      { u: 240, v: 16,  w: 16, h: 16 },
  // Row 3 – more blocks from your JSON
  'dark_oak_stairs':  { u: 0,   v: 32,  w: 16, h: 16 },
  'spruce_stairs':    { u: 16,  v: 32,  w: 16, h: 16 },
  'mud_brick_stairs': { u: 32,  v: 32,  w: 16, h: 16 },
  'spruce_slab':      { u: 48,  v: 32,  w: 16, h: 16 },
  'dark_oak_slab':    { u: 64,  v: 32,  w: 16, h: 16 },
  'andesite_stairs':  { u: 80,  v: 32,  w: 16, h: 16 },
  'stone_stairs':     { u: 96,  v: 32,  w: 16, h: 16 },
  'cobblestone_stairs':{ u:112, v: 32,  w: 16, h: 16 },
  'andesite_slab':    { u: 128, v: 32,  w: 16, h: 16 },
  'stone_slab':       { u: 144, v: 32,  w: 16, h: 16 },
  'andesite_wall':    { u: 160, v: 32,  w: 16, h: 16 },
  'dark_oak_fence':   { u: 176, v: 32,  w: 16, h: 16 },
  'spruce_fence':     { u: 192, v: 32,  w: 16, h: 16 },
  'dark_oak_button':  { u: 208, v: 32,  w: 16, h: 16 },
  'spruce_button':    { u: 224, v: 32,  w: 16, h: 16 },
  'potted_plant':     { u: 240, v: 32,  w: 16, h: 16 }, // placeholder
  // Row 4 – decorative and other
  'brown_mushroom_block': { u: 0, v: 48, w: 16, h: 16 },
  'red_mushroom_block': { u: 16, v: 48, w: 16, h: 16 },
  'azalea_leaves':    { u: 32, v: 48, w: 16, h: 16 },
  'flowering_azalea_leaves': { u: 48, v: 48, w: 16, h: 16 },
  'moss_carpet':      { u: 64, v: 48, w: 16, h: 16 },
  'scaffolding':      { u: 80, v: 48, w: 16, h: 16 },
  'cobweb':           { u: 96, v: 48, w: 16, h: 16 },
  'decorated_pot':    { u: 112, v: 48, w: 16, h: 16 },
  'flower_pot':       { u: 128, v: 48, w: 16, h: 16 },
  'lantern_hanging':  { u: 144, v: 48, w: 16, h: 16 },
  'soul_lantern':     { u: 160, v: 48, w: 16, h: 16 },
  'water_cauldron':   { u: 176, v: 48, w: 16, h: 16 },
  'cauldron':         { u: 192, v: 48, w: 16, h: 16 },
  'ladder':           { u: 208, v: 48, w: 16, h: 16 },
  'iron_bars':        { u: 224, v: 48, w: 16, h: 16 },
  'glass_pane':       { u: 240, v: 48, w: 16, h: 16 },
  // Row 5 – flowers and small plants
  'dandelion':        { u: 0,   v: 64, w: 16, h: 16 },
  'poppy':            { u: 16,  v: 64, w: 16, h: 16 },
  'blue_orchid':      { u: 32,  v: 64, w: 16, h: 16 },
  'allium':           { u: 48,  v: 64, w: 16, h: 16 },
  'azure_bluet':      { u: 64,  v: 64, w: 16, h: 16 },
  'lily_of_the_valley':{ u: 80, v: 64, w: 16, h: 16 },
  'white_tulip':      { u: 96,  v: 64, w: 16, h: 16 },
  'spruce_door':      { u: 112, v: 64, w: 16, h: 16 },
  'dark_oak_door':    { u: 128, v: 64, w: 16, h: 16 },
  'white_bed':        { u: 144, v: 64, w: 16, h: 16 },
  'crafting_table':   { u: 160, v: 64, w: 16, h: 16 },
  'furnace':          { u: 176, v: 64, w: 16, h: 16 },
  'blast_furnace':    { u: 192, v: 64, w: 16, h: 16 },
  'smoker':           { u: 208, v: 64, w: 16, h: 16 },
  'cartography_table':{ u: 224, v: 64, w: 16, h: 16 },
  'loom':             { u: 240, v: 64, w: 16, h: 16 },
  // Row 6 – more utility
  'grindstone':       { u: 0,   v: 80, w: 16, h: 16 },
  'stonecutter':      { u: 16,  v: 80, w: 16, h: 16 },
  'smithing_table':   { u: 32,  v: 80, w: 16, h: 16 },
  'jukebox':          { u: 48,  v: 80, w: 16, h: 16 },
  'note_block':       { u: 64,  v: 80, w: 16, h: 16 },
  'tripwire_hook':    { u: 80,  v: 80, w: 16, h: 16 },
  'redstone_wire':    { u: 96,  v: 80, w: 16, h: 16 },
  'heavy_weighted_pressure_plate': { u: 112, v: 80, w: 16, h: 16 },
  'light_weighted_pressure_plate': { u: 128, v: 80, w: 16, h: 16 },
  'dark_oak_pressure_plate': { u: 144, v: 80, w: 16, h: 16 },
  'spruce_pressure_plate': { u: 160, v: 80, w: 16, h: 16 },
  'anvil':            { u: 176, v: 80, w: 16, h: 16 },
  'chiseled_bookshelf': { u: 192, v: 80, w: 16, h: 16 },
  'dark_oak_shelf':   { u: 208, v: 80, w: 16, h: 16 }, // same as bookshelf side
  'brown_carpet':     { u: 224, v: 80, w: 16, h: 16 },
  'red_carpet':       { u: 240, v: 80, w: 16, h: 16 },
  // Row 7 – leaves and logs
  'oak_leaves':       { u: 0,   v: 96, w: 16, h: 16 },
  'spruce_leaves':    { u: 16,  v: 96, w: 16, h: 16 },
  'dark_oak_leaves':  { u: 32,  v: 96, w: 16, h: 16 },
  'stripped_spruce_log': { u: 48, v: 96, w: 16, h: 16 },
  'stripped_oak_log': { u: 64,  v: 96, w: 16, h: 16 },
  'spruce_wood':      { u: 80,  v: 96, w: 16, h: 16 },
  'dark_oak_wood':    { u: 96,  v: 96, w: 16, h: 16 },
  // Default for any block not mapped
  'default':          { u: 112, v: 96, w: 16, h: 16 } // stone brick pattern
};

// Fallback color (should rarely be used)
const FALLBACK_COLOR = '#8b8b8b';

// ================================================================
//  SETUP THREE.JS
// ================================================================
const container = document.getElementById('container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(CAMERA_POSITION.x, CAMERA_POSITION.y, CAMERA_POSITION.z);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 80;
controls.target.set(CAMERA_TARGET.x, CAMERA_TARGET.y, CAMERA_TARGET.z);
controls.update();

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xaabbff, 0.2);
fillLight.position.set(-10, 5, -10);
scene.add(fillLight);

// Grid floor
const gridHelper = new THREE.GridHelper(32, 32, 0xffffff, 0xffffff);
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.12;
gridHelper.position.y = -0.01;
scene.add(gridHelper);

// ================================================================
//  TEXTURED BLOCK CREATION (using atlas)
// ================================================================
let atlasTexture = null;
const materialCache = new Map();

function getUVsForBlock(blockId) {
  let rect = TEXTURE_MAP[blockId];
  if (!rect) rect = TEXTURE_MAP['default'];
  const { u, v, w, h } = rect;
  const u1 = u / ATLAS_SIZE;
  const v1 = v / ATLAS_SIZE;
  const u2 = (u + w) / ATLAS_SIZE;
  const v2 = (v + h) / ATLAS_SIZE;
  return { u1, v1, u2, v2 };
}

function getBlockMaterial(blockId) {
  if (materialCache.has(blockId)) return materialCache.get(blockId);
  
  const uvRect = getUVsForBlock(blockId);
  // Create a clone of the atlas texture for this material (so UVs can be modified)
  const texture = atlasTexture.clone();
  texture.needsUpdate = true;
  const material = new THREE.MeshStandardMaterial({
    map: texture,
    roughness: 0.6,
    metalness: 0.05,
  });
  material.userData = { uvRect };
  materialCache.set(blockId, material);
  return material;
}

const baseBoxGeo = new THREE.BoxGeometry(1, 1, 1);
function createTexturedMesh(blockId) {
  const material = getBlockMaterial(blockId);
  const uvRect = material.userData.uvRect;
  if (!uvRect || !atlasTexture) {
    // fallback to gray
    const fallbackMat = new THREE.MeshStandardMaterial({ color: FALLBACK_COLOR });
    return new THREE.Mesh(baseBoxGeo, fallbackMat);
  }
  
  // Clone geometry and remap UVs
  const geometry = baseBoxGeo.clone();
  const uvAttribute = geometry.attributes.uv;
  if (uvAttribute) {
    const uvArray = uvAttribute.array;
    for (let i = 0; i < uvArray.length; i += 2) {
      const origU = uvArray[i];
      const origV = uvArray[i+1];
      uvArray[i]   = uvRect.u1 + origU * (uvRect.u2 - uvRect.u1);
      uvArray[i+1] = uvRect.v1 + origV * (uvRect.v2 - uvRect.v1);
    }
    uvAttribute.needsUpdate = true;
  }
  const mesh = new THREE.Mesh(geometry, material);
  return mesh;
}

// ================================================================
//  LAYER MANAGEMENT
// ================================================================
const layerMeshes = {};
let currentLayer = 0;
let totalLayers = TOTAL_LAYERS;

function buildScene(data) {
  totalLayers = data.total_layers || TOTAL_LAYERS;
  document.getElementById('step-counter').textContent = `0 / ${totalLayers}`;
  
  const byLayer = {};
  for (const block of data.blocks) {
    const y = block.y;
    if (!byLayer[y]) byLayer[y] = [];
    byLayer[y].push(block);
  }
  
  for (const [yStr, blocks] of Object.entries(byLayer)) {
    const y = parseInt(yStr);
    layerMeshes[y] = [];
    for (const block of blocks) {
      const mesh = createTexturedMesh(block.id);
      mesh.position.set(block.x, block.y, block.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.visible = false;
      scene.add(mesh);
      layerMeshes[y].push(mesh);
    }
  }
  
  // Center camera
  const box = new THREE.Box3();
  for (const block of data.blocks) {
    box.expandByPoint(new THREE.Vector3(block.x, block.y, block.z));
  }
  const center = new THREE.Vector3();
  box.getCenter(center);
  controls.target.set(center.x, center.y, center.z);
  controls.update();
  gridHelper.position.x = center.x;
  gridHelper.position.z = center.z;
  
  showLayer(0);
}

function showLayer(index) {
  if (index < 0 || index >= totalLayers) return;
  currentLayer = index;
  for (const [yStr, meshes] of Object.entries(layerMeshes)) {
    const y = parseInt(yStr);
    const visible = LAYER_MODE === 'cumulative' ? y <= index : y === index;
    for (const mesh of meshes) mesh.visible = visible;
  }
  document.getElementById('step-counter').textContent = `${index+1} / ${totalLayers}`;
  document.getElementById('btn-prev').disabled = index === 0;
  document.getElementById('btn-next').disabled = index === totalLayers - 1;
}

// Navigation
document.getElementById('btn-prev').addEventListener('click', () => showLayer(currentLayer - 1));
document.getElementById('btn-next').addEventListener('click', () => showLayer(currentLayer + 1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') showLayer(currentLayer + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowDown') showLayer(currentLayer - 1);
});

// ================================================================
//  LOAD ATLAS AND DATA
// ================================================================
async function init() {
  const loadingDiv = document.getElementById('loading');
  const loadingBar = document.getElementById('loading-bar-inner');
  const loadingText = document.getElementById('loading-text');
  
  // Load atlas texture
  loadingText.textContent = 'LOADING TEXTURE ATLAS';
  loadingBar.style.width = '20%';
  try {
    const atlasImg = await new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'Anonymous';
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = ATLAS_URL;
    });
    atlasTexture = new THREE.Texture(atlasImg);
    atlasTexture.needsUpdate = true;
    loadingBar.style.width = '60%';
  } catch (e) {
    console.error('Failed to load atlas', e);
    loadingText.textContent = 'ERROR: Could not load textures';
    return;
  }
  
  // Load JSON data
  loadingText.textContent = 'LOADING BLOCKS';
  const dataUrl = BASE_URL + DATA_FILE;
  try {
    const response = await fetch(dataUrl);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    loadingBar.style.width = '100%';
    setTimeout(() => {
      loadingDiv.style.display = 'none';
      buildScene(data);
    }, 200);
  } catch (e) {
    loadingText.textContent = 'ERROR LOADING DATA';
    console.error(e);
  }
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

animate();
init();
</script>
</body>
</html>
