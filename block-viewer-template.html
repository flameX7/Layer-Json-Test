<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Block Viewer – Exact Vanilla Textures</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  #container {
    width: 100vw;
    height: 100vh;
    position: relative;
  }
  .arrow-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 16px;
    z-index: 10;
    transition: opacity 0.2s;
  }
  .arrow-btn:disabled { cursor: not-allowed; }
  .arrow-btn svg { width: 32px; height: 32px; }
  #btn-prev { left: 16px; }
  #btn-next { right: 16px; }
  #step-counter {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: sans-serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    pointer-events: none;
    z-index: 10;
    color: white;
    text-shadow: 0 0 4px black;
  }
  #loading {
    position: absolute;
    inset: 0;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 100;
  }
  #loading-text {
    font-family: sans-serif;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: white;
    text-shadow: 0 0 2px black;
  }
  #loading-bar-outer {
    width: 160px;
    height: 2px;
    background: rgba(255,255,255,0.3);
  }
  #loading-bar-inner {
    height: 100%;
    width: 0%;
    background: white;
    transition: width 0.3s;
  }
  .error-message {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: rgba(0,0,0,0.7);
    color: #ffaaaa;
    font-family: monospace;
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 6px;
    pointer-events: none;
    z-index: 20;
  }
</style>
</head>
<body>
<div id="container">
  <div id="loading">
    <div id="loading-text">LOADING TEXTURES</div>
    <div id="loading-bar-outer"><div id="loading-bar-inner"></div></div>
  </div>
  <button class="arrow-btn" id="btn-prev" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <button class="arrow-btn" id="btn-next">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>
  <div id="step-counter">1 / 1</div>
  <div id="error-log" class="error-message" style="display:none;"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ================================================================
//  CONFIGURATION – EDIT THESE TO MATCH YOUR PROJECT
// ================================================================

const BASE_URL = 'https://flamex7.github.io/Layer-Json-Test/';
const DATA_FILE = 'slime_rocket.json';
const TOTAL_LAYERS = 15;           // from your extractor
const LAYER_MODE = 'cumulative';    // 'cumulative' or 'single'
const CAMERA_POSITION = { x: 8, y: 10, z: 16 };
const CAMERA_TARGET = { x: 0, y: 3, z: 0 };

// ================================================================
//  EXACT VANILLA TEXTURES – LOADED INDIVIDUALLY
// ================================================================

// Base URL for vanilla block textures (mirror of official assets)
const TEXTURE_BASE_URL = 'https://raw.githubusercontent.com/misode/mcmeta/gh-pages/assets/minecraft/textures/block/';

// Fallback color for blocks that fail to load (rare)
const FALLBACK_COLOR = '#888888';

// UI Colors
const UI_COLORS = {
  arrow: '#ffffff',
  text:  '#ffffff',
  grid:  '#ffffff',
};

// ================================================================
//  SCENE SETUP
// ================================================================
const container = document.getElementById('container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(CAMERA_POSITION.x, CAMERA_POSITION.y, CAMERA_POSITION.z);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 80;
controls.target.set(CAMERA_TARGET.x, CAMERA_TARGET.y, CAMERA_TARGET.z);
controls.update();

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xaabbff, 0.2);
fillLight.position.set(-10, 5, -10);
scene.add(fillLight);

// Floor grid
const gridHelper = new THREE.GridHelper(32, 32, UI_COLORS.grid, UI_COLORS.grid);
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.12;
gridHelper.position.y = -0.01;
scene.add(gridHelper);

// ================================================================
//  TEXTURE LOADING WITH CACHING
// ================================================================
const materialCache = new Map(); // blockId -> Material
const loadingPromises = new Map(); // blockId -> Promise<Texture>

// Helper to convert block ID to texture filename
// Handles special cases like 'grass_block' -> 'grass_block_side', etc.
function getTextureUrl(blockId) {
  // Special mapping for blocks with different side textures
  const special = {
    'grass_block': 'grass_block_side',
    'tall_grass': 'tall_grass_bottom', // not perfect, but works
    'water_cauldron': 'water_still',
    // Add more special cases as needed
  };
  let baseName = special[blockId] || blockId;
  return `${TEXTURE_BASE_URL}${baseName}.png`;
}

async function loadTexture(blockId) {
  if (loadingPromises.has(blockId)) return loadingPromises.get(blockId);
  
  const url = getTextureUrl(blockId);
  const promise = new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'Anonymous';
    img.onload = () => {
      const texture = new THREE.Texture(img);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(1, 1);
      texture.needsUpdate = true;
      resolve(texture);
    };
    img.onerror = () => {
      console.warn(`Failed to load texture for ${blockId}, using fallback color`);
      reject(new Error(`Could not load ${url}`));
    };
    img.src = url;
  });
  loadingPromises.set(blockId, promise);
  return promise;
}

async function getMaterial(blockId) {
  if (materialCache.has(blockId)) return materialCache.get(blockId);
  
  try {
    const texture = await loadTexture(blockId);
    const material = new THREE.MeshStandardMaterial({
      map: texture,
      roughness: 0.5,
      metalness: 0.05,
    });
    materialCache.set(blockId, material);
    return material;
  } catch (e) {
    // Fallback to colored material
    const color = FALLBACK_COLOR;
    const material = new THREE.MeshStandardMaterial({ color, roughness: 0.6 });
    materialCache.set(blockId, material);
    return material;
  }
}

// Geometry reused for all blocks
const blockGeo = new THREE.BoxGeometry(1, 1, 1);

// ================================================================
//  LAYER MANAGEMENT
// ================================================================
const layerMeshes = {};
let currentLayer = 0;
let totalLayers = TOTAL_LAYERS;

async function buildScene(data) {
  totalLayers = data.total_layers || TOTAL_LAYERS;
  document.getElementById('step-counter').textContent = `0 / ${totalLayers}`;

  // Group blocks by Y layer
  const byLayer = {};
  for (const block of data.blocks) {
    const y = block.y;
    if (!byLayer[y]) byLayer[y] = [];
    byLayer[y].push(block);
  }

  // Show progress
  const loadingBar = document.getElementById('loading-bar-inner');
  const loadingText = document.getElementById('loading-text');
  const totalBlocks = data.blocks.length;
  let loadedBlocks = 0;

  for (const [yStr, blocks] of Object.entries(byLayer)) {
    const y = parseInt(yStr);
    layerMeshes[y] = [];
    
    for (const block of blocks) {
      const material = await getMaterial(block.id);
      const mesh = new THREE.Mesh(blockGeo, material);
      mesh.position.set(block.x, block.y, block.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.visible = false;
      scene.add(mesh);
      layerMeshes[y].push(mesh);
      
      loadedBlocks++;
      loadingBar.style.width = `${(loadedBlocks / totalBlocks) * 100}%`;
      loadingText.textContent = `LOADING BLOCKS (${loadedBlocks}/${totalBlocks})`;
    }
  }

  // Center the build
  const box = new THREE.Box3();
  for (const block of data.blocks) {
    box.expandByPoint(new THREE.Vector3(block.x, block.y, block.z));
  }
  const center = new THREE.Vector3();
  box.getCenter(center);
  controls.target.set(center.x, center.y, center.z);
  controls.update();
  gridHelper.position.x = center.x;
  gridHelper.position.z = center.z;

  // Hide loading screen
  document.getElementById('loading').style.display = 'none';
  showLayer(0);
}

function showLayer(index) {
  if (index < 0 || index >= totalLayers) return;
  currentLayer = index;
  for (const [yStr, meshes] of Object.entries(layerMeshes)) {
    const y = parseInt(yStr);
    const visible = LAYER_MODE === 'cumulative' ? y <= index : y === index;
    for (const mesh of meshes) mesh.visible = visible;
  }
  document.getElementById('step-counter').textContent = `${index+1} / ${totalLayers}`;
  document.getElementById('btn-prev').disabled = index === 0;
  document.getElementById('btn-next').disabled = index === totalLayers - 1;
}

// Navigation
document.getElementById('btn-prev').addEventListener('click', () => showLayer(currentLayer - 1));
document.getElementById('btn-next').addEventListener('click', () => showLayer(currentLayer + 1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') showLayer(currentLayer + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowDown') showLayer(currentLayer - 1);
});

// ================================================================
//  LOAD DATA
// ================================================================
async function init() {
  const loadingDiv = document.getElementById('loading');
  const loadingBar = document.getElementById('loading-bar-inner');
  const loadingText = document.getElementById('loading-text');
  
  loadingText.textContent = 'FETCHING BLOCK DATA';
  loadingBar.style.width = '10%';
  
  const dataUrl = BASE_URL + DATA_FILE;
  try {
    const response = await fetch(dataUrl);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    loadingBar.style.width = '30%';
    loadingText.textContent = 'LOADING TEXTURES';
    await buildScene(data);
  } catch (e) {
    loadingText.textContent = 'ERROR LOADING DATA';
    console.error(e);
    const errorDiv = document.getElementById('error-log');
    errorDiv.textContent = `Error: ${e.message}`;
    errorDiv.style.display = 'block';
  }
}

// Render loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

animate();
init();
</script>
</body>
</html>
