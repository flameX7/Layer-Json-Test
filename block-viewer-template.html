<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; }
  #container { width: 100vw; height: 100vh; position: relative; }

  .arrow-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 16px; z-index: 10;
    transition: opacity 0.2s;
  }
  .arrow-btn:disabled { opacity: 0.2; cursor: not-allowed; }
  .arrow-btn svg { width: 32px; height: 32px; }
  #btn-prev { left: 16px; }
  #btn-next { right: 16px; }

  #step-counter {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-family: sans-serif; font-size: 13px; letter-spacing: 0.1em;
    pointer-events: none; z-index: 10;
  }

  #loading {
    position: absolute; inset: 0; background: transparent;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; z-index: 100;
  }
  #loading-text { font-family: sans-serif; font-size: 12px; letter-spacing: 0.15em; }
  #loading-bar-outer { width: 160px; height: 2px; background: rgba(255,255,255,0.15); }
  #loading-bar-inner { height: 100%; width: 0%; background: white; transition: width 0.2s; }
</style>
</head>
<body>
<div id="container">
  <div id="loading">
    <div id="loading-text">LOADING</div>
    <div id="loading-bar-outer"><div id="loading-bar-inner"></div></div>
  </div>

  <button class="arrow-btn" id="btn-prev" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <button class="arrow-btn" id="btn-next">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>

  <div id="step-counter">1 / 1</div>
</div>

<!-- ================================================================
  CONFIGURATION — Edit this section for every project
================================================================ -->
<script>
// ✏️ Your GitHub Pages base URL
const BASE_URL = 'https://flamex7.github.io/Layer-Json-Test/';

// ✏️ Your block data JSON file
const DATA_FILE = 'slime_rocket.json';

// ✏️ Total layers (the extractor tells you this)
const TOTAL_LAYERS = 15;

// ✏️ 'cumulative' = layers stack up | 'single' = one layer at a time
const LAYER_MODE = 'cumulative';

// ✏️ Atlas and mapping file URLs
const ATLAS_URL  = BASE_URL + 'atlas.png';
const MAP_URL    = BASE_URL + 'texture_map.json';

// ✏️ Camera position — increase z to zoom out
const CAM_POS    = { x: 8,  y: 10, z: 16 };
const CAM_TARGET = { x: 0,  y: 3,  z: 0  };

// ✏️ UI colors
const ARROW_COLOR   = '#ffffff';
const ARROW_OPACITY = 0.7;
const ARROW_WIDTH   = 1.5;
const TEXT_COLOR    = '#ffffff';
const TEXT_OPACITY  = 0.7;
const GRID_COLOR    = '#ffffff';
const GRID_OPACITY  = 0.12;
</script>

<!-- ================================================================

  Maps a block ID from your JSON to a texture name in texture_map.json
  ✏️ Add any missing blocks here
================================================================ -->

  'end_stone_bricks':       'end_stone_bricks',

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ================================================================
//  APPLY UI COLORS
// ================================================================
document.querySelectorAll('.arrow-btn svg').forEach(svg => {
  svg.setAttribute('stroke', ARROW_COLOR);
  svg.setAttribute('stroke-width', ARROW_WIDTH);
  svg.style.opacity = ARROW_OPACITY;
});
const counter = document.getElementById('step-counter');
counter.style.color = TEXT_COLOR;
counter.style.opacity = TEXT_OPACITY;
document.getElementById('loading-text').style.color = TEXT_COLOR;

// ================================================================
//  SCENE SETUP
// ================================================================
const container = document.getElementById('container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(CAM_POS.x, CAM_POS.y, CAM_POS.z);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 80;
controls.target.set(CAM_TARGET.x, CAM_TARGET.y, CAM_TARGET.z);
controls.update();

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xaabbff, 0.2);
fillLight.position.set(-10, 5, -10);
scene.add(fillLight);

// Grid
const gc = new THREE.Color(GRID_COLOR);
const gridHelper = new THREE.GridHelper(32, 32, gc, gc);
gridHelper.material.transparent = true;
gridHelper.material.opacity = GRID_OPACITY;
gridHelper.position.y = -0.01;
scene.add(gridHelper);

// ================================================================
//  TEXTURE ATLAS SYSTEM
// ================================================================
let atlasTexture = null;
let textureMap   = null;
let atlasW = 1, atlasH = 1;

// Material cache — one material per unique block type
const materialCache = new Map();

// Shared base geometry (never modified directly)
const BASE_GEO = new THREE.BoxGeometry(1, 1, 1);

function getUVRect(blockId) {
  // Step 1: look up texture name from our block->texture map
  const texName = BLOCK_TEXTURE_MAP[blockId];

  // Step 2: look up UV rect in the atlas map
  let rect = texName ? textureMap[texName] : null;

  // Step 3: fallback — try the block id directly
  if (!rect) rect = textureMap[blockId];

  // Step 4: try stripping namespace (create/cogwheel -> cogwheel)
  if (!rect && blockId.includes('/')) {
    const short = blockId.split('/').pop();
    rect = textureMap[short];
  }

  return rect || null;
}

function buildUVGeometry(rect) {
  // Clone base geometry so we don't modify the shared one
  const geo = BASE_GEO.clone();
  const uvAttr = geo.attributes.uv;
  const arr = uvAttr.array;

  // Calculate normalized UV coordinates
  const u1 = rect.u / atlasW;
  const u2 = (rect.u + rect.w) / atlasW;
  // Flip V: Three.js UV origin is bottom-left, image origin is top-left
  const v2 = 1.0 - (rect.v / atlasH);
  const v1 = 1.0 - ((rect.v + rect.h) / atlasH);

  // Remap all UVs in the geometry to point at this texture tile
  for (let i = 0; i < arr.length; i += 2) {
    arr[i]     = u1 + arr[i]     * (u2 - u1);
    arr[i + 1] = v1 + arr[i + 1] * (v2 - v1);
  }
  uvAttr.needsUpdate = true;
  return geo;
}

function getFallbackMaterial(blockId) {
  // Generate a unique color per block type using a hash
  let hash = 0;
  for (let i = 0; i < blockId.length; i++) {
    hash = ((hash << 5) - hash) + blockId.charCodeAt(i);
  }
  const hue = Math.abs(hash % 360);
  const color = new THREE.Color().setHSL(hue / 360, 0.4, 0.5);
  return new THREE.MeshLambertMaterial({ color });
}

function createBlockMesh(blockId) {
  // Return cached mesh data if we've seen this block type before
  if (materialCache.has(blockId)) {
    const cached = materialCache.get(blockId);
    return new THREE.Mesh(cached.geo, cached.mat);
  }

  let geo, mat;

  if (atlasTexture && textureMap) {
    const rect = getUVRect(blockId);
    if (rect) {
      // Build geometry with remapped UVs for this block's texture tile
      geo = buildUVGeometry(rect);
      mat = new THREE.MeshLambertMaterial({
        map: atlasTexture,
        alphaTest: 0.1,
      });
    } else {
      // Block not found in texture map — use colored fallback
      geo = BASE_GEO.clone();
      mat = getFallbackMaterial(blockId);
    }
  } else {
    // Atlas not loaded — use colored fallback
    geo = BASE_GEO.clone();
    mat = getFallbackMaterial(blockId);
  }

  // Cache for reuse
  materialCache.set(blockId, { geo, mat });
  return new THREE.Mesh(geo, mat);
}

// ================================================================
//  LAYER SYSTEM
// ================================================================
const layerMeshes = {};
let currentLayer  = 0;
let totalLayers   = TOTAL_LAYERS;

function buildScene(data) {
  totalLayers = data.total_layers || TOTAL_LAYERS;

  const byLayer = {};
  for (const block of data.blocks) {
    if (!byLayer[block.y]) byLayer[block.y] = [];
    byLayer[block.y].push(block);
  }

  const loadingBar = document.getElementById('loading-bar-inner');
  const total = data.blocks.length;
  let done = 0;

  for (const [yStr, blocks] of Object.entries(byLayer)) {
    const y = parseInt(yStr);
    layerMeshes[y] = [];
    for (const block of blocks) {
      const mesh = createBlockMesh(block.id);
      mesh.position.set(block.x, block.y, block.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.visible = false;
      scene.add(mesh);
      layerMeshes[y].push(mesh);
      done++;
      loadingBar.style.width = `${70 + (done / total) * 30}%`;
    }
  }

  // Center build in view
  const box = new THREE.Box3();
  for (const b of data.blocks) box.expandByPoint(new THREE.Vector3(b.x, b.y, b.z));
  const center = new THREE.Vector3();
  box.getCenter(center);
  controls.target.set(center.x, center.y, center.z);
  controls.update();
  gridHelper.position.x = center.x;
  gridHelper.position.z = center.z;

  document.getElementById('loading').style.display = 'none';
  showLayer(0);
}

function showLayer(index) {
  if (index < 0 || index >= totalLayers) return;
  currentLayer = index;

  for (const [yStr, meshes] of Object.entries(layerMeshes)) {
    const y = parseInt(yStr);
    const visible = LAYER_MODE === 'cumulative' ? y <= index : y === index;
    for (const mesh of meshes) mesh.visible = visible;
  }

  document.getElementById('step-counter').textContent = `${index + 1} / ${totalLayers}`;
  document.getElementById('btn-prev').disabled = index === 0;
  document.getElementById('btn-next').disabled = index === totalLayers - 1;
}

// Button + keyboard controls
document.getElementById('btn-prev').addEventListener('click', () => showLayer(currentLayer - 1));
document.getElementById('btn-next').addEventListener('click', () => showLayer(currentLayer + 1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp')   showLayer(currentLayer + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowDown') showLayer(currentLayer - 1);
});

// ================================================================
//  LOAD EVERYTHING
// ================================================================
async function init() {
  const loadingText = document.getElementById('loading-text');
  const loadingBar  = document.getElementById('loading-bar-inner');

  // 1 — Load texture atlas image
  loadingText.textContent = 'LOADING ATLAS';
  loadingBar.style.width = '10%';
  try {
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.crossOrigin = 'Anonymous';
      i.onload  = () => resolve(i);
      i.onerror = () => reject(new Error('Atlas image failed'));
      i.src = ATLAS_URL;
    });
    atlasTexture = new THREE.Texture(img);
    atlasTexture.magFilter = THREE.NearestFilter;
    atlasTexture.minFilter = THREE.NearestFilter;
    atlasTexture.needsUpdate = true;
    atlasW = img.naturalWidth;
    atlasH = img.naturalHeight;
    loadingBar.style.width = '35%';
  } catch (e) {
    console.warn('Atlas load failed, using fallback colors:', e);
  }

  // 2 — Load texture map JSON
  loadingText.textContent = 'LOADING MAP';
  try {
    const res = await fetch(MAP_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    textureMap = await res.json();
    loadingBar.style.width = '55%';
  } catch (e) {
    console.warn('Texture map load failed, using fallback colors:', e);
  }

  // 3 — Load block data JSON
  loadingText.textContent = 'LOADING BLOCKS';
  try {
    const res = await fetch(BASE_URL + DATA_FILE);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    loadingBar.style.width = '70%';
    buildScene(data);
  } catch (e) {
    loadingText.textContent = 'ERROR — CHECK CONSOLE';
    console.error('Block data load failed:', e);
  }
}

// ================================================================
//  RENDER LOOP
// ================================================================
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

animate();
init();
</script>
</body>
</html>
