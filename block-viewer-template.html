<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Block Viewer – Textured</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  #container {
    width: 100vw;
    height: 100vh;
    position: relative;
  }
  .arrow-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 16px;
    z-index: 10;
    transition: opacity 0.2s;
  }
  .arrow-btn:disabled { cursor: not-allowed; }
  .arrow-btn svg { width: 32px; height: 32px; }
  #btn-prev { left: 16px; }
  #btn-next { right: 16px; }
  #step-counter {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: sans-serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    pointer-events: none;
    z-index: 10;
  }
  #loading {
    position: absolute;
    inset: 0;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 100;
  }
  #loading-text {
    font-family: sans-serif;
    font-size: 12px;
    letter-spacing: 0.15em;
  }
  #loading-bar-outer {
    width: 160px;
    height: 2px;
    background: rgba(255,255,255,0.15);
  }
  #loading-bar-inner {
    height: 100%;
    width: 0%;
    background: white;
    transition: width 0.3s;
  }
</style>
</head>
<body>
<div id="container">
  <div id="loading">
    <div id="loading-text">LOADING TEXTURES</div>
    <div id="loading-bar-outer"><div id="loading-bar-inner"></div></div>
  </div>
  <button class="arrow-btn" id="btn-prev" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <button class="arrow-btn" id="btn-next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>
  <div id="step-counter">1 / 1</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ================================================================
//  ✏️  CONFIGURATION – EDIT THIS SECTION
// ================================================================

// Your JSON data file (same as before)
const BASE_URL = 'https://flamex7.github.io/Layer-Json-Test/';
const DATA_FILE = 'slime_rocket.json';
const TOTAL_LAYERS = 15;          // from your extractor
const LAYER_MODE = 'cumulative';   // 'cumulative' or 'single'
const CAMERA_POSITION = { x: 8, y: 10, z: 16 };
const CAMERA_TARGET = { x: 0, y: 3, z: 0 };

// ─── TEXTURE ATLAS SETUP ──────────────────────────────────────
// 1. URL to your texture atlas image (must support CORS)
const ATLAS_URL = 'https://github.com/SlimaneMihoubi/Minecraft-Textures';
// 2. Size of each block texture in the atlas (usually 16 or 32)
const TEXTURE_SIZE = 16;
// 3. Total width/height of the atlas (in pixels)
const ATLAS_WIDTH = 256;
const ATLAS_HEIGHT = 256;

// 4. Texture mapping: map each block ID to pixel coordinates (top-left) inside the atlas
const TEXTURE_MAP = {
  // Vanilla blocks (example coordinates – adjust to your atlas!)
  'slime_block':      { u: 0,   v: 0,   w: 16, h: 16 },
  'sticky_piston':    { u: 16,  v: 0,   w: 16, h: 16 },
  'piston':           { u: 32,  v: 0,   w: 16, h: 16 },
  'observer':         { u: 48,  v: 0,   w: 16, h: 16 },
  'redstone_block':   { u: 64,  v: 0,   w: 16, h: 16 },
  'stone':            { u: 80,  v: 0,   w: 16, h: 16 },
  'cobblestone':      { u: 96,  v: 0,   w: 16, h: 16 },
  'oak_planks':       { u: 112, v: 0,   w: 16, h: 16 },
  'glass':            { u: 128, v: 0,   w: 16, h: 16 },
  'iron_block':       { u: 144, v: 0,   w: 16, h: 16 },
  'gold_block':       { u: 160, v: 0,   w: 16, h: 16 },
  'diamond_block':    { u: 176, v: 0,   w: 16, h: 16 },
  'dirt':             { u: 192, v: 0,   w: 16, h: 16 },
  'grass_block':      { u: 208, v: 0,   w: 16, h: 16 },
  'sand':             { u: 224, v: 0,   w: 16, h: 16 },
  // Create mod blocks – add your own entries
  'create/cogwheel':  { u: 0,   v: 16,  w: 16, h: 16 },
  'create/shaft':     { u: 16,  v: 16,  w: 16, h: 16 },
  // ... add more as needed
};

// Fallback color for blocks without a texture mapping
const FALLBACK_COLOR = '#888888';

// UI Colors (optional)
const UI_COLORS = {
  arrow: '#ffffff',
  text:  '#ffffff',
  grid:  '#ffffff',
};

// ================================================================
//  🛠️  GENERATE A DEBUG ATLAS (if you don't have a real one)
// ================================================================
function generateDebugAtlas() {
  const canvas = document.createElement('canvas');
  canvas.width = ATLAS_WIDTH;
  canvas.height = ATLAS_HEIGHT;
  const ctx = canvas.getContext('2d');
  // Fill with a checkerboard pattern
  ctx.fillStyle = '#333';
  ctx.fillRect(0, 0, ATLAS_WIDTH, ATLAS_HEIGHT);
  for (let y = 0; y < ATLAS_HEIGHT; y += TEXTURE_SIZE) {
    for (let x = 0; x < ATLAS_WIDTH; x += TEXTURE_SIZE) {
      ctx.fillStyle = ((x + y) / TEXTURE_SIZE) % 2 === 0 ? '#5a5a5a' : '#7a7a7a';
      ctx.fillRect(x, y, TEXTURE_SIZE, TEXTURE_SIZE);
      ctx.strokeStyle = '#aaa';
      ctx.strokeRect(x, y, TEXTURE_SIZE, TEXTURE_SIZE);
    }
  }
  // Write block IDs for debugging (optional)
  for (const [id, { u, v }] of Object.entries(TEXTURE_MAP)) {
    ctx.fillStyle = 'white';
    ctx.font = '10px monospace';
    ctx.fillText(id.slice(0, 4), u + 2, v + 12);
  }
  return new THREE.CanvasTexture(canvas);
}

// ================================================================
//  SCENE SETUP
// ================================================================
const container = document.getElementById('container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(CAMERA_POSITION.x, CAMERA_POSITION.y, CAMERA_POSITION.z);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 80;
controls.target.set(CAMERA_TARGET.x, CAMERA_TARGET.y, CAMERA_TARGET.z);
controls.update();

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xaabbff, 0.2);
fillLight.position.set(-10, 5, -10);
scene.add(fillLight);

// Floor grid
const gridHelper = new THREE.GridHelper(32, 32, UI_COLORS.grid, UI_COLORS.grid);
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.12;
gridHelper.position.y = -0.01;
scene.add(gridHelper);

// ================================================================
//  TEXTURED BLOCK MATERIAL
// ================================================================
let atlasTexture = null;
const materialCache = new Map(); // blockId -> Material

function getUVsForBlock(blockId) {
  const rect = TEXTURE_MAP[blockId];
  if (!rect) return null;
  const { u, v, w, h } = rect;
  // Convert pixel coordinates to UV (0..1)
  const u1 = u / ATLAS_WIDTH;
  const v1 = v / ATLAS_HEIGHT;
  const u2 = (u + w) / ATLAS_WIDTH;
  const v2 = (v + h) / ATLAS_HEIGHT;
  return { u1, v1, u2, v2 };
}

function getBlockMaterial(blockId) {
  if (materialCache.has(blockId)) return materialCache.get(blockId);

  const uvRect = getUVsForBlock(blockId);
  if (uvRect && atlasTexture) {
    // Clone the texture to allow different UVs per material
    const tex = atlasTexture.clone();
    tex.needsUpdate = true;
    const material = new THREE.MeshStandardMaterial({
      map: tex,
      roughness: 0.6,
      metalness: 0.1,
    });
    // Store UV transform on the material userData (for demonstration)
    material.userData = { uvRect };
    materialCache.set(blockId, material);
    return material;
  } else {
    // Fallback to solid color
    const color = FALLBACK_COLOR;
    const material = new THREE.MeshStandardMaterial({ color, roughness: 0.5 });
    materialCache.set(blockId, material);
    return material;
  }
}

// Override UVs – because three.js BoxGeometry uses UVs 0-1 per face,
// we need to modify the geometry's UVs to show the correct part of the atlas.
// Simpler approach: create a custom geometry for each block type with remapped UVs.
const baseBoxGeo = new THREE.BoxGeometry(1, 1, 1);
function createTexturedMesh(blockId) {
  const material = getBlockMaterial(blockId);
  const uvRect = material.userData?.uvRect;
  if (!uvRect || !atlasTexture) {
    // No texture – just return a standard mesh
    return new THREE.Mesh(baseBoxGeo, material);
  }

  // Clone geometry and remap UVs for all faces to the same atlas region
  const geometry = baseBoxGeo.clone();
  const uvAttribute = geometry.attributes.uv;
  if (uvAttribute) {
    const uvArray = uvAttribute.array;
    // Each vertex gets a UV coordinate (0..1). We remap them all to the block's rect.
    for (let i = 0; i < uvArray.length; i += 2) {
      // Original UV (u in 0..1, v in 0..1) – we map the whole square to the target rect
      const origU = uvArray[i];
      const origV = uvArray[i+1];
      // Map [0,1] -> [u1, u2] and [0,1] -> [v1, v2]
      uvArray[i]   = uvRect.u1 + origU * (uvRect.u2 - uvRect.u1);
      uvArray[i+1] = uvRect.v1 + origV * (uvRect.v2 - uvRect.v1);
    }
    uvAttribute.needsUpdate = true;
  }
  const mesh = new THREE.Mesh(geometry, material);
  return mesh;
}

// ================================================================
//  LAYER MANAGEMENT
// ================================================================
const layerMeshes = {};
let currentLayer = 0;
let totalLayers = TOTAL_LAYERS;

function buildScene(data) {
  totalLayers = data.total_layers || TOTAL_LAYERS;
  document.getElementById('step-counter').textContent = `0 / ${totalLayers}`;

  const byLayer = {};
  for (const block of data.blocks) {
    const y = block.y;
    if (!byLayer[y]) byLayer[y] = [];
    byLayer[y].push(block);
  }

  for (const [yStr, blocks] of Object.entries(byLayer)) {
    const y = parseInt(yStr);
    layerMeshes[y] = [];
    for (const block of blocks) {
      const mesh = createTexturedMesh(block.id);
      mesh.position.set(block.x, block.y, block.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.visible = false;
      scene.add(mesh);
      layerMeshes[y].push(mesh);
    }
  }

  // Center the build
  const box = new THREE.Box3();
  for (const block of data.blocks) {
    box.expandByPoint(new THREE.Vector3(block.x, block.y, block.z));
  }
  const center = new THREE.Vector3();
  box.getCenter(center);
  controls.target.set(center.x, center.y, center.z);
  controls.update();
  gridHelper.position.x = center.x;
  gridHelper.position.z = center.z;

  showLayer(0);
}

function showLayer(index) {
  if (index < 0 || index >= totalLayers) return;
  currentLayer = index;
  for (const [yStr, meshes] of Object.entries(layerMeshes)) {
    const y = parseInt(yStr);
    const visible = LAYER_MODE === 'cumulative' ? y <= index : y === index;
    for (const mesh of meshes) mesh.visible = visible;
  }
  document.getElementById('step-counter').textContent = `${index+1} / ${totalLayers}`;
  document.getElementById('btn-prev').disabled = index === 0;
  document.getElementById('btn-next').disabled = index === totalLayers - 1;
}

// Navigation
document.getElementById('btn-prev').addEventListener('click', () => showLayer(currentLayer - 1));
document.getElementById('btn-next').addEventListener('click', () => showLayer(currentLayer + 1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') showLayer(currentLayer + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowDown') showLayer(currentLayer - 1);
});

// ================================================================
//  LOAD DATA AND TEXTURES
// ================================================================
async function init() {
  const loadingDiv = document.getElementById('loading');
  const loadingBar = document.getElementById('loading-bar-inner');
  const loadingText = document.getElementById('loading-text');

  // 1. Load texture atlas
  loadingText.textContent = 'LOADING TEXTURES';
  loadingBar.style.width = '10%';
  let atlasLoaded = false;
  if (ATLAS_URL && ATLAS_URL !== 'https://your-server.com/minecraft_atlas.png') {
    try {
      const tex = await new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = () => {
          const texture = new THREE.Texture(img);
          texture.needsUpdate = true;
          resolve(texture);
        };
        img.onerror = reject;
        img.src = ATLAS_URL;
      });
      atlasTexture = tex;
      atlasLoaded = true;
    } catch (e) {
      console.warn('Could not load external atlas, using debug atlas', e);
    }
  }
  if (!atlasLoaded) {
    atlasTexture = generateDebugAtlas();
  }
  loadingBar.style.width = '50%';

  // 2. Load JSON block data
  loadingText.textContent = 'LOADING BLOCKS';
  const dataUrl = BASE_URL + DATA_FILE;
  try {
    const response = await fetch(dataUrl);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    loadingBar.style.width = '100%';
    setTimeout(() => {
      loadingDiv.style.display = 'none';
      buildScene(data);
    }, 200);
  } catch (e) {
    loadingText.textContent = 'ERROR LOADING DATA';
    console.error(e);
  }
}

// Render loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

animate();
init();
</script>
</body>
</html>
