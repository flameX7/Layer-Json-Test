<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  #container {
    width: 100vw;
    height: 100vh;
    position: relative;
  }

  /* ── Arrow Buttons ── */
  .arrow-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 16px;
    z-index: 10;
    transition: opacity 0.2s;
  }
  .arrow-btn:disabled { cursor: not-allowed; }
  .arrow-btn svg { width: 32px; height: 32px; }
  #btn-prev { left: 16px; }
  #btn-next { right: 16px; }

  /* ── Step Counter ── */
  #step-counter {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: sans-serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    pointer-events: none;
    z-index: 10;
  }

  /* ── Loading ── */
  #loading {
    position: absolute;
    inset: 0;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 100;
  }
  #loading-text {
    font-family: sans-serif;
    font-size: 12px;
    letter-spacing: 0.15em;
  }
  #loading-bar-outer {
    width: 160px;
    height: 2px;
    background: rgba(255,255,255,0.15);
  }
  #loading-bar-inner {
    height: 100%;
    width: 0%;
    transition: width 0.3s;
  }
</style>
</head>
<body>
<div id="container">
  <div id="loading">
    <div id="loading-text">LOADING</div>
    <div id="loading-bar-outer">
      <div id="loading-bar-inner"></div>
    </div>
  </div>

  <button class="arrow-btn" id="btn-prev" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <button class="arrow-btn" id="btn-next">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>

  <div id="step-counter">1 / 1</div>
</div>

<!-- ================================================================
  THREE.JS — Do not edit
================================================================ -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ================================================================
//  ✏️  EDIT THIS SECTION FOR EVERY NEW PROJECT
// ================================================================

// 1. Your GitHub Pages base URL
//    Format: https://YOUR-USERNAME.github.io/YOUR-REPO-NAME/
const BASE_URL = 'https://flamex7.github.io/Layer-Json-Test/';

// 2. Your exported JSON block data file name
const DATA_FILE = 'slime_rocket.json';

// 3. Total number of layers (copy from extractor script output)
//    The extractor will tell you this after running
const TOTAL_LAYERS = 6;

// 4. Layer mode:
//    'cumulative' — each step adds a layer on top (recommended)
//    'single'     — shows only the current layer
const LAYER_MODE = 'cumulative';

// 5. Camera starting position
//    Increase z to zoom out, increase y to look more from above
const CAMERA_POSITION = { x: 8, y: 10, z: 16 };

// 6. Camera target — center point the camera looks at
//    Adjust y if your build is very tall
const CAMERA_TARGET = { x: 0, y: 3, z: 0 };

// ================================================================
//  🎨  COLORS — Edit these to customize the viewer appearance
//  All values are hex color strings e.g. '#ffffff'
//  Opacity is 0.0 (invisible) to 1.0 (fully visible)
// ================================================================

const COLORS = {

  // ── Arrow buttons ──
  arrow: {
    color:   '#ffffff',   // ✏️ Arrow color
    opacity:  0.7,        // ✏️ Arrow opacity (0.0 - 1.0)
    thickness: 1.5,       // ✏️ Arrow stroke thickness in px
  },

  // ── Step counter text (e.g. "1 / 6") ──
  text: {
    color:   '#ffffff',   // ✏️ Text color
    opacity:  0.7,        // ✏️ Text opacity (0.0 - 1.0)
  },

  // ── Loading text and bar ──
  loading: {
    color:   '#ffffff',   // ✏️ Loading text color
    opacity:  0.6,        // ✏️ Loading opacity (0.0 - 1.0)
  },

  // ── Floor grid ──
  grid: {
    color:   '#ffffff',   // ✏️ Grid line color
    opacity:  0.12,       // ✏️ Grid opacity (0.0 - 1.0)
  },

};

// ================================================================
//  🟦  BLOCK COLORS — Fallback colors for blocks without textures
//  Format: 'block_id': '#hexcolor'
//  Add Create mod blocks here with custom colors
// ================================================================

const BLOCK_COLORS = {
  // ── Vanilla blocks ──
  'slime_block':         '#7cc25a',
  'sticky_piston':       '#8b7355',
  'piston':              '#8b7355',
  'piston_head':         '#8b7355',
  'observer':            '#4a4a4a',
  'redstone_wire':       '#cc0000',
  'redstone_block':      '#cc0000',
  'stone':               '#888888',
  'cobblestone':         '#777777',
  'oak_planks':          '#c4a055',
  'oak_log':             '#6b4f2a',
  'glass':               '#aaddff',
  'iron_block':          '#d4d4d4',
  'gold_block':          '#f5c542',
  'diamond_block':       '#4dd9e0',
  'obsidian':            '#1a0a2e',
  'dirt':                '#8b5e3c',
  'grass_block':         '#5a8a3c',
  'sand':                '#e2c97e',
  'gravel':              '#888070',
  'barrel':              '#8b6914',
  'chest':               '#a0762a',
  'furnace':             '#777777',
  'crafting_table':      '#8b6914',

  // ── Create mod blocks ──
  // ✏️ Add your Create mod blocks here with approximate colors
  'create/cogwheel':              '#c8a96e',
  'create/large_cogwheel':        '#c8a96e',
  'create/shaft':                 '#b8925a',
  'create/mechanical_piston':     '#8b7355',
  'create/mechanical_pump':       '#8b7355',
  'create/fluid_pipe':            '#888888',
  'create/andesite_casing':       '#888888',
  'create/brass_casing':          '#c8a040',
  'create/copper_casing':         '#c87040',
  'create/creative_motor':        '#4488cc',
  'create/deployer':              '#8b7355',
  'create/mechanical_arm':        '#c8a040',
  'create/belt':                  '#4a3520',
  'create/chute':                 '#888888',
  'create/funnel':                '#888888',
  'create/depot':                 '#888888',
  'create/basin':                 '#888888',
  'create/mixer':                 '#888888',
  'create/blaze_burner':          '#cc4400',

  // ✏️ Default color for any block not listed above
  'default':                      '#888888',
};

// ================================================================
//  ⚙️  SCENE SETUP — No need to edit below
// ================================================================

// Apply colors to UI elements
function applyUIColors() {
  // Arrows
  const arrows = document.querySelectorAll('.arrow-btn svg');
  arrows.forEach(svg => {
    svg.setAttribute('stroke', COLORS.arrow.color);
    svg.setAttribute('stroke-width', COLORS.arrow.thickness);
    svg.style.opacity = COLORS.arrow.opacity;
  });

  // Step counter
  const counter = document.getElementById('step-counter');
  counter.style.color = COLORS.text.color;
  counter.style.opacity = COLORS.text.opacity;

  // Loading
  const loadingText = document.getElementById('loading-text');
  loadingText.style.color = COLORS.loading.color;
  loadingText.style.opacity = COLORS.loading.opacity;

  const loadingBar = document.getElementById('loading-bar-inner');
  loadingBar.style.background = COLORS.loading.color;
}

applyUIColors();

// Renderer
const container = document.getElementById('container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// Scene
const scene = new THREE.Scene();

// Camera
const camera = new THREE.PerspectiveCamera(
  45,
  container.clientWidth / container.clientHeight,
  0.1,
  1000
);
camera.position.set(CAMERA_POSITION.x, CAMERA_POSITION.y, CAMERA_POSITION.z);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 80;
controls.target.set(CAMERA_TARGET.x, CAMERA_TARGET.y, CAMERA_TARGET.z);
controls.update();

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0xaabbff, 0.2);
fillLight.position.set(-10, 5, -10);
scene.add(fillLight);

// Grid floor
const gridColor = new THREE.Color(COLORS.grid.color);
const gridHelper = new THREE.GridHelper(32, 32, gridColor, gridColor);
gridHelper.material.opacity = COLORS.grid.opacity;
gridHelper.material.transparent = true;
gridHelper.position.y = -0.01;
scene.add(gridHelper);

// ================================================================
//  📦  BLOCK RENDERING
// ================================================================

// Geometry shared across all blocks — one cube
const blockGeo = new THREE.BoxGeometry(1, 1, 1);

// Material cache — reuse materials for same block type
const materialCache = {};

function getBlockColor(blockId) {
  if (BLOCK_COLORS[blockId]) return BLOCK_COLORS[blockId];
  if (BLOCK_COLORS['default']) return BLOCK_COLORS['default'];
  return '#888888';
}

function getBlockMaterial(blockId) {
  if (materialCache[blockId]) return materialCache[blockId];
  const color = getBlockColor(blockId);
  const mat = new THREE.MeshLambertMaterial({ color: new THREE.Color(color) });
  materialCache[blockId] = mat;
  return mat;
}

// ================================================================
//  🗂️  LAYER DATA
// ================================================================

// Stores meshes grouped by Y layer
// layerMeshes[y] = [ mesh, mesh, ... ]
const layerMeshes = {};
let currentLayer = 0;
let totalLayers = TOTAL_LAYERS;

function buildScene(data) {
  totalLayers = data.total_layers || TOTAL_LAYERS;

  // Update step counter total
  updateCounter(0);

  // Group blocks by Y layer
  const byLayer = {};
  for (const block of data.blocks) {
    const y = block.y;
    if (!byLayer[y]) byLayer[y] = [];
    byLayer[y].push(block);
  }

  // Create meshes for each layer
  for (const [yStr, blocks] of Object.entries(byLayer)) {
    const y = parseInt(yStr);
    layerMeshes[y] = [];

    for (const block of blocks) {
      const mat = getBlockMaterial(block.id);
      const mesh = new THREE.Mesh(blockGeo, mat);
      mesh.position.set(block.x, block.y, block.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.visible = false;
      scene.add(mesh);
      layerMeshes[y].push(mesh);
    }
  }

  // Center the build
  const box = new THREE.Box3();
  for (const block of data.blocks) {
    box.expandByPoint(new THREE.Vector3(block.x, block.y, block.z));
  }
  const center = new THREE.Vector3();
  box.getCenter(center);
  controls.target.set(center.x, center.y, center.z);
  controls.update();

  // Update grid position
  gridHelper.position.x = center.x;
  gridHelper.position.z = center.z;

  showLayer(0);
}

// ================================================================
//  🎮  LAYER NAVIGATION
// ================================================================

function showLayer(index) {
  if (index < 0 || index >= totalLayers) return;
  currentLayer = index;

  for (const [yStr, meshes] of Object.entries(layerMeshes)) {
    const y = parseInt(yStr);
    const visible = LAYER_MODE === 'cumulative' ? y <= index : y === index;
    for (const mesh of meshes) {
      mesh.visible = visible;
    }
  }

  updateCounter(index);
  document.getElementById('btn-prev').disabled = index === 0;
  document.getElementById('btn-next').disabled = index === totalLayers - 1;
}

function updateCounter(index) {
  document.getElementById('step-counter').textContent =
    `${index + 1} / ${totalLayers}`;
}

document.getElementById('btn-prev').addEventListener('click', () => showLayer(currentLayer - 1));
document.getElementById('btn-next').addEventListener('click', () => showLayer(currentLayer + 1));

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp')   showLayer(currentLayer + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowDown') showLayer(currentLayer - 1);
});

// ================================================================
//  📡  LOAD DATA
// ================================================================

async function loadData() {
  const url = BASE_URL + DATA_FILE;
  const loadingBar = document.getElementById('loading-bar-inner');

  try {
    loadingBar.style.width = '30%';
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    loadingBar.style.width = '70%';
    const data = await response.json();
    loadingBar.style.width = '100%';
    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';
      buildScene(data);
    }, 200);
  } catch (e) {
    document.getElementById('loading-text').textContent = 'ERROR LOADING DATA';
    console.error('Failed to load block data:', e);
  }
}

// ================================================================
//  🔄  RENDER LOOP
// ================================================================

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

animate();
loadData();
</script>
</body>
</html>
