<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Viewer – Your Own Atlas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; }
  #container { width: 100vw; height: 100vh; position: relative; }
  .arrow-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 16px; z-index: 10;
  }
  .arrow-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .arrow-btn svg { width: 32px; height: 32px; stroke: white; stroke-width: 1.5; }
  #btn-prev { left: 16px; }
  #btn-next { right: 16px; }
  #step-counter {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-family: sans-serif; font-size: 13px; letter-spacing: 0.1em;
    pointer-events: none; z-index: 10; color: white;
    background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 20px;
  }
  #loading {
    position: absolute; inset: 0; background: rgba(0,0,0,0.8);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(4px);
  }
  #loading-text { font-family: sans-serif; font-size: 14px; color: white; margin-bottom: 12px; }
  #loading-bar-outer { width: 200px; height: 3px; background: rgba(255,255,255,0.3); border-radius: 3px; }
  #loading-bar-inner { height: 100%; width: 0%; background: #7cc25a; transition: width 0.2s; }
  #error-log {
    position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7);
    color: #ffaaaa; font-family: monospace; font-size: 12px; padding: 8px; border-radius: 6px;
    pointer-events: none; z-index: 200; max-width: 80%; white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="container">
  <div id="loading">
    <div id="loading-text">LOADING TEXTURES</div>
    <div id="loading-bar-outer"><div id="loading-bar-inner"></div></div>
  </div>
  <button class="arrow-btn" id="btn-prev" disabled>
    <svg viewBox="0 0 24 24" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </button>
  <button class="arrow-btn" id="btn-next">
    <svg viewBox="0 0 24 24" fill="none"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </button>
  <div id="step-counter">1 / 1</div>
  <div id="error-log"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ========== CONFIGURATION ==========
const BASE_URL = 'https://flamex7.github.io/Layer-Json-Test/';  
const DATA_FILE = 'slime_rocket.json';
const TOTAL_LAYERS = 15;
const LAYER_MODE = 'cumulative'; // 'cumulative' or 'single'
const CAMERA_POS = { x: 8, y: 10, z: 16 };
const CAMERA_TARGET = { x: 0, y: 3, z: 0 };

const ATLAS_URL = 'https://flamex7.github.io/Layer-Json-Test/atlas.png';
const MAPPING_URL = 'https://flamex7.github.io/Layer-Json-Test/texture_map.json';

// ========== THREE.JS SETUP ==========
const container = document.getElementById('container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(CAMERA_POS.x, CAMERA_POS.y, CAMERA_POS.z);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(CAMERA_TARGET.x, CAMERA_TARGET.y, CAMERA_TARGET.z);
controls.update();

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);
scene.add(new THREE.DirectionalLight(0xaabbff, 0.2).position.set(-10, 5, -10));

// Grid
const gridHelper = new THREE.GridHelper(32, 32, 0xffffff, 0xffffff);
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.12;
gridHelper.position.y = -0.01;
scene.add(gridHelper);

// ========== GLOBALS ==========
let atlasTexture = null;
let textureMap = null;
let useFallback = false;
const materialCache = new Map();
const layerMeshes = {};
let currentLayer = 0;
let totalLayers = TOTAL_LAYERS;

// Shared base material configurations to prevent layout thrashing
let sharedAtlasMaterial = null;

// ========== FALLBACK PROCEDURAL TEXTURES (safe) ==========
function createFallbackTexture(blockId) {
  const canvas = document.createElement('canvas');
  canvas.width = 16; // Smaller for performance
  canvas.height = 16;
  const ctx = canvas.getContext('2d');
  let hash = 0;
  for (let i = 0; i < blockId.length; i++) hash = ((hash << 5) - hash) + blockId.charCodeAt(i);
  const hue = Math.abs(hash % 360);
  const color = new THREE.Color().setHSL(hue / 360, 0.7, 0.5);
  ctx.fillStyle = `rgb(${color.r*255},${color.g*255},${color.b*255})`;
  ctx.fillRect(0, 0, 16, 16);
  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 1;
  ctx.strokeRect(0, 0, 16, 16);
  
  const texture = new THREE.CanvasTexture(canvas);
  texture.magFilter = THREE.NearestFilter;
  texture.minFilter = THREE.NearestFilter;
  return texture;
}

function getFallbackMaterial(blockId) {
  if (materialCache.has(blockId)) return materialCache.get(blockId);
  const texture = createFallbackTexture(blockId);
  const mat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.6 });
  materialCache.set(blockId, mat);
  return mat;
}

// ========== ATLAS-BASED MATERIAL MAPPING ==========
function getAtlasMaterialData(blockId) {
  let rect = textureMap[blockId];
  if (!rect) {
    const firstKey = Object.keys(textureMap)[0];
    rect = textureMap[firstKey];
    if (!rect) return null;
  }
  
  const atlasW = atlasTexture.image.width;
  const atlasH = atlasTexture.image.height;
  
  // Calculate UV window coordinates
  return {
    u1: rect.u / atlasW,
    v1: 1.0 - ((rect.v + rect.h) / atlasH), // Flip V coordinate for Three.js space
    u2: (rect.u + rect.w) / atlasW,
    v2: 1.0 - (rect.v / atlasH)
  };
}

function createMesh(blockId) {
  let geometry = new THREE.BoxGeometry(1, 1, 1);
  let material;

  if (useFallback || !atlasTexture) {
    material = getFallbackMaterial(blockId);
  } else {
    material = sharedAtlasMaterial;
    const uvData = getAtlasMaterialData(blockId);
    
    if (uvData) {
      // Unshare/clone geometry for each unique block type to apply custom UV data
      geometry = geometry.clone(); 
      const uvAttr = geometry.attributes.uv;
      const uvArray = uvAttr.array;
      const { u1, v1, u2, v2 } = uvData;
      
      // Update custom geometry UV boundaries based on box faces maps
      for (let i = 0; i < uvArray.length; i += 2) {
        const origU = uvArray[i];
        const origV = uvArray[i+1];
        uvArray[i]   = u1 + origU * (u2 - u1);
        uvArray[i+1] = v1 + origV * (v2 - v1);
      }
      uvAttr.needsUpdate = true;
    } else {
      material = getFallbackMaterial(blockId);
    }
  }

  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// ========== BUILD SCENE ==========
async function buildScene(data) {
  totalLayers = data.total_layers || TOTAL_LAYERS;
  const byLayer = {};
  for (const block of data.blocks) {
    const y = block.y;
    if (!byLayer[y]) byLayer[y] = [];
    byLayer[y].push(block);
  }
  
  const loadingBar = document.getElementById('loading-bar-inner');
  const totalBlocks = data.blocks.length;
  let processed = 0;
  
  for (const [yStr, blocks] of Object.entries(byLayer)) {
    const y = parseInt(yStr);
    layerMeshes[y] = [];
    for (const block of blocks) {
      const mesh = createMesh(block.id);
      mesh.position.set(block.x, block.y, block.z);
      mesh.visible = false;
      scene.add(mesh);
      layerMeshes[y].push(mesh);
      processed++;
      loadingBar.style.width = `${70 + (processed / totalBlocks) * 30}%`;
    }
  }
  
  // Center camera setup
  const box = new THREE.Box3();
  for (const block of data.blocks) box.expandByPoint(new THREE.Vector3(block.x, block.y, block.z));
  const center = new THREE.Vector3();
  box.getCenter(center);
  controls.target.set(center.x, center.y, center.z);
  controls.update();
  gridHelper.position.x = center.x;
  gridHelper.position.z = center.z;
  
  document.getElementById('loading').style.display = 'none';
  showLayer(0);
}

function showLayer(index) {
  if (index < 0 || index >= totalLayers) return;
  currentLayer = index;
  for (const [yStr, meshes] of Object.entries(layerMeshes)) {
    const y = parseInt(yStr);
    const visible = LAYER_MODE === 'cumulative' ? y <= index : y === index;
    for (const mesh of meshes) mesh.visible = visible;
  }
  document.getElementById('step-counter').textContent = `${index+1} / ${totalLayers}`;
  document.getElementById('btn-prev').disabled = index === 0;
  document.getElementById('btn-next').disabled = index === totalLayers - 1;
}

document.getElementById('btn-prev').addEventListener('click', () => showLayer(currentLayer - 1));
document.getElementById('btn-next').addEventListener('click', () => showLayer(currentLayer + 1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') showLayer(currentLayer + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowDown') showLayer(currentLayer - 1);
});

// ========== LOAD ATLAS AND MAPPING ==========
async function init() {
  const errorDiv = document.getElementById('error-log');
  const loadingText = document.getElementById('loading-text');
  const loadingBar = document.getElementById('loading-bar-inner');
  
  try {
    // Load atlas image
    loadingText.textContent = 'LOADING ATLAS';
    loadingBar.style.width = '10%';
    const img = await new Promise((resolve, reject) => {
      const image = new Image();
      image.crossOrigin = 'Anonymous';  
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error(`Failed to load ${ATLAS_URL}`));
      image.src = ATLAS_URL;
    });
    
    atlasTexture = new THREE.Texture(img);
    // Minecraft pixelation configuration: 
    atlasTexture.magFilter = THREE.NearestFilter;
    atlasTexture.minFilter = THREE.NearestFilter;
    atlasTexture.needsUpdate = true;
    
    // Create single instance material instance referenced universally
    sharedAtlasMaterial = new THREE.MeshStandardMaterial({ map: atlasTexture, roughness: 0.6 });
    loadingBar.style.width = '40%';
    
    // Load mapping JSON
    loadingText.textContent = 'LOADING MAPPING';
    const res = await fetch(MAPPING_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status} for ${MAPPING_URL}`);
    textureMap = await res.json();
    loadingBar.style.width = '60%';
    useFallback = false;
    errorDiv.textContent = '✓ Real textures loaded successfully!';
    errorDiv.style.color = '#aaffaa';
  } catch (err) {
    console.warn(err);
    errorDiv.textContent = `⚠️ Could not load real textures: ${err.message}. Using colorful fallback.`;
    errorDiv.style.color = '#ffaa88';
    useFallback = true;
    loadingBar.style.width = '60%';
  }
  
  // Load JSON block data
  loadingText.textContent = 'LOADING BLOCKS';
  const dataUrl = BASE_URL + DATA_FILE;
  try {
    const response = await fetch(dataUrl);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    loadingBar.style.width = '80%';
    await buildScene(data);
  } catch (err) {
    errorDiv.textContent = `ERROR: ${err.message}`;
    errorDiv.style.color = '#ffaaaa';
    loadingText.textContent = 'ERROR LOADING DATA';
  }
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

animate();
init();
</script>
</body>
</html>
