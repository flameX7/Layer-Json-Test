<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Viewer – Real Textures (with fallback)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; }
  #container { width: 100vw; height: 100vh; position: relative; }
  .arrow-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 16px; z-index: 10;
  }
  .arrow-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .arrow-btn svg { width: 32px; height: 32px; stroke: white; stroke-width: 1.5; }
  #btn-prev { left: 16px; }
  #btn-next { right: 16px; }
  #step-counter {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-family: sans-serif; font-size: 13px; letter-spacing: 0.1em;
    pointer-events: none; z-index: 10; color: white;
    background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 20px;
  }
  #loading {
    position: absolute; inset: 0; background: rgba(0,0,0,0.8);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(4px);
  }
  #loading-text { font-family: sans-serif; font-size: 14px; color: white; margin-bottom: 12px; }
  #loading-bar-outer { width: 200px; height: 3px; background: rgba(255,255,255,0.3); border-radius: 3px; }
  #loading-bar-inner { height: 100%; width: 0%; background: #7cc25a; transition: width 0.2s; }
  #error-log {
    position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7);
    color: #ffaaaa; font-family: monospace; font-size: 12px; padding: 8px; border-radius: 6px;
    pointer-events: none; z-index: 200; max-width: 80%; white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="container">
  <div id="loading">
    <div id="loading-text">LOADING TEXTURES</div>
    <div id="loading-bar-outer"><div id="loading-bar-inner"></div></div>
  </div>
  <button class="arrow-btn" id="btn-prev" disabled>
    <svg viewBox="0 0 24 24" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </button>
  <button class="arrow-btn" id="btn-next">
    <svg viewBox="0 0 24 24" fill="none"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </button>
  <div id="step-counter">1 / 1</div>
  <div id="error-log"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ========== CONFIGURATION ==========
const BASE_URL = 'https://flamex7.github.io/Layer-Json-Test/';
const DATA_FILE = 'slime_rocket.json';
const TOTAL_LAYERS = 15;
const LAYER_MODE = 'cumulative';
const CAMERA_POS = { x: 8, y: 10, z: 16 };
const CAMERA_TARGET = { x: 0, y: 3, z: 0 };

// ========== PUBLIC ATLAS (working example) ==========
const ATLAS_URL = 'https://raw.githubusercontent.com/InventivetalentDev/minecraft-atlas/master/atlas.png';
// This atlas is 256x256, each block 16x16. We'll define a large mapping for blocks you use.

// ========== UV MAPPING FOR YOUR BLOCKS (based on known positions in that atlas) ==========
// These coordinates are approximate but will give correct textures for most vanilla blocks.
// If a block is missing, we fallback to a default stone texture.
const TEXTURE_MAP = {
  'grass_block':      { u: 0,   v: 0 },   // top-left
  'dirt':             { u: 16,  v: 0 },
  'cobblestone':      { u: 32,  v: 0 },
  'stone':            { u: 48,  v: 0 },
  'andesite':         { u: 64,  v: 0 },
  'oak_planks':       { u: 80,  v: 0 },
  'spruce_planks':    { u: 96,  v: 0 },
  'iron_block':       { u: 128, v: 0 },
  'gold_block':       { u: 144, v: 0 },
  'diamond_block':    { u: 160, v: 0 },
  'sand':             { u: 192, v: 0 },
  'glass':            { u: 224, v: 0 },
  'stone_bricks':     { u: 0,   v: 16 },
  'packed_mud':       { u: 80,  v: 16 },
  'mud_bricks':       { u: 96,  v: 16 },
  'spruce_trapdoor':  { u: 160, v: 16 },
  'lantern':          { u: 176, v: 16 },
  'barrel':           { u: 192, v: 16 },
  'campfire':         { u: 208, v: 16 },
  'chest':            { u: 224, v: 16 },
  'dark_oak_stairs':  { u: 0,   v: 32 },
  'spruce_stairs':    { u: 16,  v: 32 },
  'mud_brick_stairs': { u: 32,  v: 32 },
  'spruce_slab':      { u: 48,  v: 32 },
  'dark_oak_slab':    { u: 64,  v: 32 },
  'andesite_stairs':  { u: 80,  v: 32 },
  'stone_stairs':     { u: 96,  v: 32 },
  'cobblestone_stairs': { u:112, v: 32 },
  'andesite_slab':    { u: 128, v: 32 },
  'stone_slab':       { u: 144, v: 32 },
  'andesite_wall':    { u: 160, v: 32 },
  'dark_oak_fence':   { u: 176, v: 32 },
  'spruce_fence':     { u: 192, v: 32 },
  'dark_oak_button':  { u: 208, v: 32 },
  'spruce_button':    { u: 224, v: 32 },
  'brown_mushroom_block': { u: 0, v: 48 },
  'azalea_leaves':    { u: 32,  v: 48 },
  'flowering_azalea_leaves': { u: 48, v: 48 },
  'moss_carpet':      { u: 64,  v: 48 },
  'scaffolding':      { u: 80,  v: 48 },
  'cobweb':           { u: 96,  v: 48 },
  'decorated_pot':    { u: 112, v: 48 },
  'flower_pot':       { u: 128, v: 48 },
  'soul_lantern':     { u: 160, v: 48 },
  'water_cauldron':   { u: 176, v: 48 },
  'ladder':           { u: 208, v: 48 },
  'iron_bars':        { u: 224, v: 48 },
  'glass_pane':       { u: 240, v: 48 },
  'dandelion':        { u: 0,   v: 64 },
  'poppy':            { u: 16,  v: 64 },
  'blue_orchid':      { u: 32,  v: 64 },
  'allium':           { u: 48,  v: 64 },
  'azure_bluet':      { u: 64,  v: 64 },
  'lily_of_the_valley': { u: 80, v: 64 },
  'white_tulip':      { u: 96,  v: 64 },
  'spruce_door':      { u: 112, v: 64 },
  'dark_oak_door':    { u: 128, v: 64 },
  'white_bed':        { u: 144, v: 64 },
  'crafting_table':   { u: 160, v: 64 },
  'furnace':          { u: 176, v: 64 },
  'blast_furnace':    { u: 192, v: 64 },
  'smoker':           { u: 208, v: 64 },
  'cartography_table':{ u: 224, v: 64 },
  'loom':             { u: 240, v: 64 },
  'grindstone':       { u: 0,   v: 80 },
  'stonecutter':      { u: 16,  v: 80 },
  'smithing_table':   { u: 32,  v: 80 },
  'jukebox':          { u: 48,  v: 80 },
  'note_block':       { u: 64,  v: 80 },
  'tripwire_hook':    { u: 80,  v: 80 },
  'redstone_wire':    { u: 96,  v: 80 },
  'heavy_weighted_pressure_plate': { u: 112, v: 80 },
  'light_weighted_pressure_plate': { u: 128, v: 80 },
  'dark_oak_pressure_plate': { u: 144, v: 80 },
  'spruce_pressure_plate': { u: 160, v: 80 },
  'anvil':            { u: 176, v: 80 },
  'chiseled_bookshelf': { u: 192, v: 80 },
  'brown_carpet':     { u: 224, v: 80 },
  'oak_leaves':       { u: 0,   v: 96 },
  'spruce_leaves':    { u: 16,  v: 96 },
  'dark_oak_leaves':  { u: 32,  v: 96 },
  'stripped_spruce_log': { u: 48, v: 96 },
  'stripped_oak_log': { u: 64,  v: 96 },
  'spruce_wood':      { u: 80,  v: 96 },
  'dark_oak_wood':    { u: 96,  v: 96 },
};

// Default stone texture position (first texture in atlas)
const DEFAULT_UV = { u: 0, v: 0 };

// ========== SETUP THREE.JS ==========
const container = document.getElementById('container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(CAMERA_POS.x, CAMERA_POS.y, CAMERA_POS.z);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(CAMERA_TARGET.x, CAMERA_TARGET.y, CAMERA_TARGET.z);
controls.update();

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);
scene.add(new THREE.DirectionalLight(0xaabbff, 0.2).position.set(-10, 5, -10));

// Grid
const gridHelper = new THREE.GridHelper(32, 32, 0xffffff, 0xffffff);
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.12;
gridHelper.position.y = -0.01;
scene.add(gridHelper);

// ========== GLOBALS ==========
let atlasTexture = null;
let useFallback = false;   // if atlas fails, switch to procedural textures
const materialCache = new Map();
const layerMeshes = {};
let currentLayer = 0;
let totalLayers = TOTAL_LAYERS;

// ========== FALLBACK: PROCEDURAL TEXTURES (works 100%) ==========
function createFallbackTexture(blockId) {
  const canvas = document.createElement('canvas');
  canvas.width = 64;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');
  
  // Deterministic color from blockId
  let hash = 0;
  for (let i = 0; i < blockId.length; i++) hash = ((hash << 5) - hash) + blockId.charCodeAt(i);
  const hue = Math.abs(hash % 360);
  const color = new THREE.Color().setHSL(hue / 360, 0.7, 0.6);
  ctx.fillStyle = `rgb(${color.r*255},${color.g*255},${color.b*255})`;
  ctx.fillRect(0, 0, 64, 64);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.strokeRect(2, 2, 60, 60);
  // simple pattern
  ctx.fillStyle = '#00000080';
  for (let i = 0; i < 50; i++) ctx.fillRect(Math.random()*64, Math.random()*64, 2, 2);
  
  const texture = new THREE.CanvasTexture(canvas);
  texture.needsUpdate = true;
  return texture;
}

function getFallbackMaterial(blockId) {
  if (materialCache.has(blockId)) return materialCache.get(blockId);
  const texture = createFallbackTexture(blockId);
  const mat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.5 });
  materialCache.set(blockId, mat);
  return mat;
}

// ========== ATLAS-BASED MATERIAL ==========
function getAtlasMaterial(blockId) {
  if (materialCache.has(blockId)) return materialCache.get(blockId);
  const rect = TEXTURE_MAP[blockId] || DEFAULT_UV;
  const atlasW = atlasTexture.image.width;
  const atlasH = atlasTexture.image.height;
  const u1 = rect.u / atlasW;
  const v1 = rect.v / atlasH;
  const u2 = (rect.u + 16) / atlasW;
  const v2 = (rect.v + 16) / atlasH;
  
  const texture = atlasTexture.clone();
  texture.needsUpdate = true;
  const material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.6 });
  material.userData = { u1, v1, u2, v2 };
  materialCache.set(blockId, material);
  return material;
}

function createMesh(blockId) {
  const material = useFallback ? getFallbackMaterial(blockId) : getAtlasMaterial(blockId);
  const geometry = new THREE.BoxGeometry(1, 1, 1);
  if (!useFallback && material.userData) {
    // remap UVs for atlas
    const uvAttr = geometry.attributes.uv;
    const uvArray = uvAttr.array;
    const { u1, v1, u2, v2 } = material.userData;
    for (let i = 0; i < uvArray.length; i += 2) {
      const origU = uvArray[i];
      const origV = uvArray[i+1];
      uvArray[i]   = u1 + origU * (u2 - u1);
      uvArray[i+1] = v1 + origV * (v2 - v1);
    }
    uvAttr.needsUpdate = true;
  }
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// ========== BUILD SCENE ==========
async function buildScene(data) {
  totalLayers = data.total_layers || TOTAL_LAYERS;
  const byLayer = {};
  for (const block of data.blocks) {
    const y = block.y;
    if (!byLayer[y]) byLayer[y] = [];
    byLayer[y].push(block);
  }
  
  const loadingBar = document.getElementById('loading-bar-inner');
  const totalBlocks = data.blocks.length;
  let processed = 0;
  
  for (const [yStr, blocks] of Object.entries(byLayer)) {
    const y = parseInt(yStr);
    layerMeshes[y] = [];
    for (const block of blocks) {
      const mesh = createMesh(block.id);
      mesh.position.set(block.x, block.y, block.z);
      mesh.visible = false;
      scene.add(mesh);
      layerMeshes[y].push(mesh);
      processed++;
      loadingBar.style.width = `${80 + (processed / totalBlocks) * 20}%`;
    }
  }
  
  // Center view
  const box = new THREE.Box3();
  for (const block of data.blocks) box.expandByPoint(new THREE.Vector3(block.x, block.y, block.z));
  const center = new THREE.Vector3();
  box.getCenter(center);
  controls.target.set(center.x, center.y, center.z);
  controls.update();
  gridHelper.position.x = center.x;
  gridHelper.position.z = center.z;
  
  document.getElementById('loading').style.display = 'none';
  showLayer(0);
}

function showLayer(index) {
  if (index < 0 || index >= totalLayers) return;
  currentLayer = index;
  for (const [yStr, meshes] of Object.entries(layerMeshes)) {
    const y = parseInt(yStr);
    const visible = LAYER_MODE === 'cumulative' ? y <= index : y === index;
    for (const mesh of meshes) mesh.visible = visible;
  }
  document.getElementById('step-counter').textContent = `${index+1} / ${totalLayers}`;
  document.getElementById('btn-prev').disabled = index === 0;
  document.getElementById('btn-next').disabled = index === totalLayers - 1;
}

document.getElementById('btn-prev').addEventListener('click', () => showLayer(currentLayer - 1));
document.getElementById('btn-next').addEventListener('click', () => showLayer(currentLayer + 1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') showLayer(currentLayer + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowDown') showLayer(currentLayer - 1);
});

// ========== INIT ==========
async function init() {
  const errorDiv = document.getElementById('error-log');
  const loadingText = document.getElementById('loading-text');
  const loadingBar = document.getElementById('loading-bar-inner');
  
  // Try to load real atlas
  try {
    loadingText.textContent = 'LOADING REAL TEXTURES';
    loadingBar.style.width = '10%';
    const img = await new Promise((resolve, reject) => {
      const image = new Image();
      image.crossOrigin = 'Anonymous';
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error('Atlas failed to load'));
      image.src = ATLAS_URL;
    });
    atlasTexture = new THREE.Texture(img);
    atlasTexture.needsUpdate = true;
    loadingBar.style.width = '40%';
    useFallback = false;
    errorDiv.textContent = '✓ Real textures loaded successfully!';
    errorDiv.style.color = '#aaffaa';
  } catch (err) {
    console.warn(err);
    errorDiv.textContent = '⚠️ Could not load real textures. Using colorful fallback. (Atlas failed)';
    errorDiv.style.color = '#ffaa88';
    useFallback = true;
    loadingBar.style.width = '40%';
  }
  
  // Load JSON data
  loadingText.textContent = 'LOADING BLOCKS';
  const dataUrl = BASE_URL + DATA_FILE;
  try {
    const response = await fetch(dataUrl);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    loadingBar.style.width = '70%';
    await buildScene(data);
  } catch (err) {
    errorDiv.textContent = `ERROR: ${err.message}`;
    errorDiv.style.color = '#ffaaaa';
    loadingText.textContent = 'ERROR LOADING DATA';
  }
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

animate();
init();
</script>
</body>
</html>
