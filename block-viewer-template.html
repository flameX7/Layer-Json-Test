<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Viewer – Real Vanilla Textures</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; }
  #container { width: 100vw; height: 100vh; position: relative; }
  .arrow-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 16px; z-index: 10;
  }
  .arrow-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .arrow-btn svg { width: 32px; height: 32px; stroke: white; stroke-width: 1.5; }
  #btn-prev { left: 16px; }
  #btn-next { right: 16px; }
  #step-counter {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-family: sans-serif; font-size: 13px; letter-spacing: 0.1em;
    pointer-events: none; z-index: 10; color: white;
    background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 20px;
  }
  #loading {
    position: absolute; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(4px);
  }
  #loading-text { font-family: sans-serif; font-size: 14px; color: white; margin-bottom: 12px; }
  #loading-bar-outer { width: 200px; height: 3px; background: rgba(255,255,255,0.3); border-radius: 3px; }
  #loading-bar-inner { height: 100%; width: 0%; background: #7cc25a; transition: width 0.2s; }
</style>
</head>
<body>
<div id="container">
  <div id="loading">
    <div id="loading-text">LOADING TEXTURES</div>
    <div id="loading-bar-outer"><div id="loading-bar-inner"></div></div>
  </div>
  <button class="arrow-btn" id="btn-prev" disabled><svg viewBox="0 0 24 24" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
  <button class="arrow-btn" id="btn-next"><svg viewBox="0 0 24 24" fill="none"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
  <div id="step-counter">1 / 1</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ========== CONFIGURATION – EDIT THESE THREE LINES ==========
const BASE_URL = 'https://flamex7.github.io/Layer-Json-Test/';
const DATA_FILE = 'slime_rocket.json';
const TOTAL_LAYERS = 15;
// ============================================================

// Your hosted atlas and mapping (replace with your raw GitHub URLs)
const ATLAS_URL = 'https://raw.githubusercontent.com/flameX7/minecraft-textures/main/atlas.png';
const MAPPING_URL = 'https://raw.githubusercontent.com/flameX7/minecraft-textures/main/texture_map.json';

// ========== THREE.JS SETUP ==========
const container = document.getElementById('container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(8, 10, 16);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 3, 0);
controls.update();

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xaabbff, 0.2);
fillLight.position.set(-10, 5, -10);
scene.add(fillLight);

// Grid
const gridHelper = new THREE.GridHelper(32, 32, 0xffffff, 0xffffff);
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.12;
gridHelper.position.y = -0.01;
scene.add(gridHelper);

// ========== ATLAS RENDERING ==========
let atlasTexture = null;
let textureMap = null;
const materialCache = new Map();

async function loadAtlasAndMapping() {
  const loadingBar = document.getElementById('loading-bar-inner');
  const loadingText = document.getElementById('loading-text');
  
  loadingText.textContent = 'LOADING ATLAS';
  loadingBar.style.width = '20%';
  
  // Load atlas image
  const img = await new Promise((resolve, reject) => {
    const image = new Image();
    image.crossOrigin = 'Anonymous';
    image.onload = () => resolve(image);
    image.onerror = reject;
    image.src = ATLAS_URL;
  });
  atlasTexture = new THREE.Texture(img);
  atlasTexture.needsUpdate = true;
  
  loadingBar.style.width = '50%';
  loadingText.textContent = 'LOADING MAPPING';
  
  // Load mapping JSON
  const res = await fetch(MAPPING_URL);
  if (!res.ok) throw new Error(`Mapping HTTP ${res.status}`);
  textureMap = await res.json();
  
  loadingBar.style.width = '70%';
  return true;
}

function getUVs(blockId) {
  const rect = textureMap[blockId];
  if (!rect) {
    // Fallback to a default area (first texture)
    return { u1: 0, v1: 0, u2: 16/256, v2: 16/256 };
  }
  const { u, v, w, h } = rect;
  const atlasSize = 256; // adjust if your atlas is different size! You can read from image.
  // We'll dynamically get atlas size
  const width = atlasTexture.image.width;
  const height = atlasTexture.image.height;
  return {
    u1: u / width,
    v1: v / height,
    u2: (u + w) / width,
    v2: (v + h) / height
  };
}

function getBlockMaterial(blockId) {
  if (materialCache.has(blockId)) return materialCache.get(blockId);
  
  const uvRect = getUVs(blockId);
  const texture = atlasTexture.clone();
  texture.needsUpdate = true;
  const material = new THREE.MeshStandardMaterial({
    map: texture,
    roughness: 0.6,
    metalness: 0.05,
  });
  material.userData = { uvRect };
  materialCache.set(blockId, material);
  return material;
}

const baseGeo = new THREE.BoxGeometry(1, 1, 1);
function createTexturedMesh(blockId) {
  const material = getBlockMaterial(blockId);
  const uvRect = material.userData.uvRect;
  const geometry = baseGeo.clone();
  const uvAttr = geometry.attributes.uv;
  if (uvAttr && uvRect) {
    const uvArray = uvAttr.array;
    for (let i = 0; i < uvArray.length; i += 2) {
      const origU = uvArray[i];
      const origV = uvArray[i+1];
      uvArray[i]   = uvRect.u1 + origU * (uvRect.u2 - uvRect.u1);
      uvArray[i+1] = uvRect.v1 + origV * (uvRect.v2 - uvRect.v1);
    }
    uvAttr.needsUpdate = true;
  }
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// ========== LAYER MANAGEMENT ==========
const layerMeshes = {};
let currentLayer = 0;
let totalLayers = TOTAL_LAYERS;

async function buildScene(data) {
  totalLayers = data.total_layers || TOTAL_LAYERS;
  document.getElementById('step-counter').textContent = `0 / ${totalLayers}`;
  
  const byLayer = {};
  for (const block of data.blocks) {
    const y = block.y;
    if (!byLayer[y]) byLayer[y] = [];
    byLayer[y].push(block);
  }
  
  const loadingBar = document.getElementById('loading-bar-inner');
  const totalBlocks = data.blocks.length;
  let processed = 0;
  
  for (const [yStr, blocks] of Object.entries(byLayer)) {
    const y = parseInt(yStr);
    layerMeshes[y] = [];
    for (const block of blocks) {
      const mesh = createTexturedMesh(block.id);
      mesh.position.set(block.x, block.y, block.z);
      mesh.visible = false;
      scene.add(mesh);
      layerMeshes[y].push(mesh);
      processed++;
      loadingBar.style.width = `${70 + (processed / totalBlocks) * 30}%`;
    }
  }
  
  // Center camera
  const box = new THREE.Box3();
  for (const block of data.blocks) {
    box.expandByPoint(new THREE.Vector3(block.x, block.y, block.z));
  }
  const center = new THREE.Vector3();
  box.getCenter(center);
  controls.target.set(center.x, center.y, center.z);
  controls.update();
  gridHelper.position.x = center.x;
  gridHelper.position.z = center.z;
  
  document.getElementById('loading').style.display = 'none';
  showLayer(0);
}

function showLayer(index) {
  if (index < 0 || index >= totalLayers) return;
  currentLayer = index;
  for (const [yStr, meshes] of Object.entries(layerMeshes)) {
    const y = parseInt(yStr);
    const visible = (LAYER_MODE === 'cumulative' ? y <= index : y === index);
    for (const mesh of meshes) mesh.visible = visible;
  }
  document.getElementById('step-counter').textContent = `${index+1} / ${totalLayers}`;
  document.getElementById('btn-prev').disabled = index === 0;
  document.getElementById('btn-next').disabled = index === totalLayers - 1;
}

document.getElementById('btn-prev').addEventListener('click', () => showLayer(currentLayer - 1));
document.getElementById('btn-next').addEventListener('click', () => showLayer(currentLayer + 1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') showLayer(currentLayer + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowDown') showLayer(currentLayer - 1);
});

// ========== INIT ==========
async function init() {
  try {
    await loadAtlasAndMapping();
    const dataUrl = BASE_URL + DATA_FILE;
    const response = await fetch(dataUrl);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    await buildScene(data);
  } catch (err) {
    document.getElementById('loading-text').textContent = 'ERROR: ' + err.message;
    console.error(err);
  }
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

animate();
init();
</script>
</body>
</html>
