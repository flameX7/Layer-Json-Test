<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Layer Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; }
  #container { width: 100vw; height: 100vh; position: relative; }

  .arrow-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 16px; z-index: 10;
    transition: opacity 0.2s;
  }
  .arrow-btn:disabled { cursor: not-allowed; }
  .arrow-btn svg { width: 32px; height: 32px; }
  #btn-prev { left: 16px; }
  #btn-next { right: 16px; }

  #step-counter {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-family: sans-serif; font-size: 13px; letter-spacing: 0.1em;
    pointer-events: none; z-index: 10;
  }

  #loading {
    position: absolute; inset: 0; background: transparent;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; z-index: 100;
  }
  #loading-text {
    font-family: sans-serif; font-size: 12px; letter-spacing: 0.15em;
  }
  #loading-bar-outer { width: 160px; height: 2px; background: rgba(255,255,255,0.15); }
  #loading-bar-inner { height: 100%; width: 0%; transition: width 0.3s; }
</style>
</head>
<body>
<div id="container">
  <div id="loading">
    <div id="loading-text">LOADING</div>
    <div id="loading-bar-outer"><div id="loading-bar-inner"></div></div>
  </div>
  <button class="arrow-btn" id="btn-prev" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <button class="arrow-btn" id="btn-next">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>
  <div id="step-counter">1 / 1</div>
</div>

function makeAtlasMaterial(texName) {
  // Returns a MeshBasicMaterial (full brightness, no lighting darkening)
  // using a canvas-extracted texture for this tile
  if (texCache.has(texName)) return texCache.get(texName);

  const rect = textureMap[texName];
  if (!rect || !atlasTexture) return null;

  // Extract this tile from atlas onto a small canvas
  const canvas = document.createElement('canvas');
  canvas.width  = rect.w;
  canvas.height = rect.h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(
    atlasTexture.image,
    rect.u, rect.v, rect.w, rect.h,
    0, 0, rect.w, rect.h
  );

  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter  = THREE.NearestFilter;
  tex.minFilter  = THREE.NearestFilter;
  tex.needsUpdate = true;

  // MeshLambertMaterial gives the shaded look matching vanilla Minecraft
  const mat = new THREE.MeshLambertMaterial({
    map:         tex,
    alphaTest:   0.1,
    transparent: true,
    side:        THREE.DoubleSide, // needed for X-plane plants to show from all angles
  });

  texCache.set(texName, mat);
  return mat;
}

function resolveTex(blockId) {
  if (BLOCK_TEXTURES[blockId]) return BLOCK_TEXTURES[blockId];
  if (textureMap && textureMap[blockId]) return blockId;
  const stripped = blockId.split(':').pop().split('/').pop();
  if (textureMap && textureMap[stripped]) return stripped;
  return null;
}

function makeFallbackMaterial(blockId) {
  let hash = 0;
  for (let i = 0; i < blockId.length; i++) hash = ((hash << 5) - hash) + blockId.charCodeAt(i);
  const color = new THREE.Color().setHSL(Math.abs(hash % 360) / 360, 0.45, 0.55);
  return new THREE.MeshLambertMaterial({ color });
}

function makeXPlaneGeometry() {
  // Two crossed planes forming an X shape — like vanilla Minecraft flowers
  // Each plane is a flat quad rotated 45 degrees, spanning the full block space
  const geo = new THREE.BufferGeometry();

  // Each plane: 4 vertices, 2 triangles
  // Plane 1: rotated 45° around Y axis
  // Plane 2: rotated -45° around Y axis
  const s = 0.5; // half size

  const positions = new Float32Array([
    // Plane 1 — NW to SE diagonal
    -s,  s, -s,   // top left
     s,  s,  s,   // top right
    -s, -s, -s,   // bottom left
     s, -s,  s,   // bottom right
    // Plane 2 — NE to SW diagonal (back face)
    -s,  s, -s,
     s,  s,  s,
    -s, -s, -s,
     s, -s,  s,
    // Plane 3 — SW to NE diagonal
     s,  s, -s,
    -s,  s,  s,
     s, -s, -s,
    -s, -s,  s,
    // Plane 4 — back face of plane 3
     s,  s, -s,
    -s,  s,  s,
     s, -s, -s,
    -s, -s,  s,
  ]);

  const uvs = new Float32Array([
    // Plane 1 UVs
    0, 1,  1, 1,  0, 0,  1, 0,
    // Plane 2 UVs (same)
    1, 1,  0, 1,  1, 0,  0, 0,
    // Plane 3 UVs
    0, 1,  1, 1,  0, 0,  1, 0,
    // Plane 4 UVs
    1, 1,  0, 1,  1, 0,  0, 0,
  ]);

  const indices = new Uint16Array([
    // Plane 1
    0, 2, 1,  1, 2, 3,
    // Plane 2 (back face)
    4, 5, 6,  5, 7, 6,
    // Plane 3
    8, 10, 9,  9, 10, 11,
    // Plane 4 (back face)
    12, 13, 14,  13, 15, 14,
  ]);

  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('uv',       new THREE.BufferAttribute(uvs, 2));
  geo.setIndex(new THREE.BufferAttribute(indices, 1));
  geo.computeVertexNormals();
  return geo;
}

// Shared X-plane geometry instance
const XPLANE_GEO = makeXPlaneGeometry();

function makeXPlaneMesh(blockId) {
  const texName = XPLANE_BLOCKS[blockId];
  const mat     = texName ? makeAtlasMaterial(texName) : makeFallbackMaterial(blockId);
  const mesh    = new THREE.Mesh(XPLANE_GEO, mat || makeFallbackMaterial(blockId));
  return mesh;
}

function getBlockMesh(blockId) {
  // ── X-plane blocks (flowers, plants, saplings) ──
  if (XPLANE_BLOCKS[blockId]) {
    return makeXPlaneMesh(blockId);
  }

  if (blockCache.has(blockId)) {
    const c = blockCache.get(blockId);
    return new THREE.Mesh(c.geo, c.mats);
  }

  const geo = new THREE.BoxGeometry(1, 1, 1);
  let mats;

  if (atlasTexture && textureMap) {
    const faceDef = FACE_TEXTURES[blockId];
    if (faceDef) {
      mats = faceDef.map(texName => {
        const m = makeAtlasMaterial(texName);
        return m || makeFallbackMaterial(blockId);
      });
    } else {
      const texName = resolveTex(blockId);
      if (texName) {
        const m = makeAtlasMaterial(texName);
        mats = m ? Array(6).fill(m) : Array(6).fill(makeFallbackMaterial(blockId));
      } else {
        mats = Array(6).fill(makeFallbackMaterial(blockId));
      }
    }
  } else {
    mats = Array(6).fill(makeFallbackMaterial(blockId));
  }

  blockCache.set(blockId, { geo, mats });
  return new THREE.Mesh(geo, mats);
}

// ── Layer System ─────────────────────────────────────────────────
const layerMeshes = {};
let currentLayer  = 0;
let totalLayers   = TOTAL_LAYERS;

function buildScene(data) {
  totalLayers = data.total_layers || TOTAL_LAYERS;

  // Group blocks by Y level
  const byLayer = {};
  for (const block of data.blocks) {
    if (!byLayer[block.y]) byLayer[block.y] = [];
    byLayer[block.y].push(block);
  }

  const total = data.blocks.length;
  let done = 0;

  for (const [yStr, blocks] of Object.entries(byLayer)) {
    const y = parseInt(yStr);
    layerMeshes[y] = [];
    for (const block of blocks) {
      const mesh = getBlockMesh(block.id);
      mesh.position.set(block.x, block.y, block.z);
      mesh.visible       = false;
      scene.add(mesh);
      layerMeshes[y].push(mesh);
      done++;
      loadingBar.style.width = `${60 + (done / total) * 40}%`;
    }
  }

  // Auto-center camera on the build
  const box = new THREE.Box3();
  for (const b of data.blocks) box.expandByPoint(new THREE.Vector3(b.x, b.y, b.z));
  const center = new THREE.Vector3();
  box.getCenter(center);
  controls.target.set(center.x, center.y, center.z);
  controls.update();
  grid.position.x = center.x;
  grid.position.z = center.z;

  document.getElementById('loading').style.display = 'none';
  showLayer(0);
}

function showLayer(index) {
  if (index < 0 || index >= totalLayers) return;
  currentLayer = index;

  for (const [yStr, meshes] of Object.entries(layerMeshes)) {
    const y       = parseInt(yStr);
    const visible = LAYER_MODE === 'cumulative' ? y <= index : y === index;
    for (const mesh of meshes) mesh.visible = visible;
  }

  stepCounter.textContent = `${index + 1} / ${totalLayers}`;
  document.getElementById('btn-prev').disabled = index === 0;
  document.getElementById('btn-next').disabled = index === totalLayers - 1;
}

// Controls
document.getElementById('btn-prev').addEventListener('click', () => showLayer(currentLayer - 1));
document.getElementById('btn-next').addEventListener('click', () => showLayer(currentLayer + 1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp')   showLayer(currentLayer + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowDown') showLayer(currentLayer - 1);
});

// ── Load Everything ──────────────────────────────────────────────
async function init() {
  // Step 1 — Load texture atlas
  loadingText.textContent = 'LOADING ATLAS';
  loadingBar.style.width  = '10%';
  try {
    const img = await new Promise((resolve, reject) => {
      const i       = new Image();
      i.crossOrigin = 'Anonymous';
      i.onload      = () => resolve(i);
      i.onerror     = () => reject(new Error('Atlas failed to load'));
      i.src         = BASE_URL + ATLAS_FILE;
    });
    atlasTexture            = new THREE.Texture(img);
    atlasTexture.magFilter  = THREE.NearestFilter;
    atlasTexture.minFilter  = THREE.NearestFilter;
    atlasTexture.needsUpdate = true;
    atlasW = img.naturalWidth;
    atlasH = img.naturalHeight;
    loadingBar.style.width  = '30%';
  } catch (e) {
    console.warn('Atlas not loaded — using fallback colors:', e.message);
  }

  // Step 2 — Load texture map
  loadingText.textContent = 'LOADING MAP';
  try {
    const res = await fetch(BASE_URL + MAP_FILE);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    textureMap             = await res.json();
    loadingBar.style.width = '55%';
  } catch (e) {
    console.warn('Texture map not loaded — using fallback colors:', e.message);
  }

  // Step 3 — Load block data
  loadingText.textContent = 'LOADING BLOCKS';
  try {
    const res = await fetch(BASE_URL + DATA_FILE);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data             = await res.json();
    loadingBar.style.width = '60%';
    buildScene(data);
  } catch (e) {
    loadingText.textContent = 'ERROR — CHECK CONSOLE';
    console.error('Block data failed:', e);
  }
}

// ── Render Loop ──────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

animate();
init();
</script>
</body>
</html>
