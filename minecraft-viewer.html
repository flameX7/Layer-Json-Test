<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Layer Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; }
  #container { width: 100vw; height: 100vh; position: relative; }
  .arrow-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 16px; z-index: 10;
    transition: opacity 0.2s;
  }
  .arrow-btn:disabled { cursor: not-allowed; }
  .arrow-btn svg { width: 32px; height: 32px; }
  #btn-prev { left: 16px; }
  #btn-next { right: 16px; }
  #step-counter {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-family: sans-serif; font-size: 13px; letter-spacing: 0.1em;
    pointer-events: none; z-index: 10;
  }
  #loading {
    position: absolute; inset: 0; background: transparent;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; z-index: 100;
  }
  #loading-text { font-family: sans-serif; font-size: 12px; letter-spacing: 0.15em; }
  #loading-bar-outer { width: 160px; height: 2px; background: rgba(255,255,255,0.15); }
  #loading-bar-inner { height: 100%; width: 0%; transition: width 0.3s; }
</style>
</head>
<body>
<div id="container">
  <div id="loading">
    <div id="loading-text">LOADING</div>
    <div id="loading-bar-outer"><div id="loading-bar-inner"></div></div>
  </div>
  <button class="arrow-btn" id="btn-prev" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>

</div>

// ── Texture system ───────────────────────────────────────────────
let atlasImg   = null;
let textureMap = null;
let atlasW = 1, atlasH = 1;
const matCache = new Map();

function tileMat(texName) {
  if (matCache.has(texName)) return matCache.get(texName);
  const rect = textureMap?.[texName];
  if (!rect || !atlasImg) return null;
  const c = document.createElement('canvas');
  c.width = rect.w; c.height = rect.h;
  c.getContext('2d').drawImage(atlasImg, rect.u, rect.v, rect.w, rect.h, 0, 0, rect.w, rect.h);
  const tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  const mat = new THREE.MeshLambertMaterial({
    map: tex, transparent: true, alphaTest: 0.1, side: THREE.DoubleSide,
  });
  matCache.set(texName, mat); return mat;
}

function fallbackMat(id) {
  const k = '__fb__' + id;
  if (matCache.has(k)) return matCache.get(k);
  let h = 0;
  for (let i = 0; i < id.length; i++) h = ((h << 5) - h) + id.charCodeAt(i);
  const m = new THREE.MeshLambertMaterial({
    color: new THREE.Color().setHSL(Math.abs(h % 360) / 360, 0.45, 0.55),
  });
  matCache.set(k, m); return m;
}

function resolveTex(id) {
  if (BLOCK_TEX[id]) return BLOCK_TEX[id];
  if (textureMap?.[id]) return id;
  const s = id.split(':').pop().split('/').pop();
  if (textureMap?.[s]) return s;
  return null;
}

function getMat(texName, id) {
  return tileMat(texName) || fallbackMat(id);
}

function get6Mats(id) {
  const f = FACE_TEX[id];
  if (f) return f.map(t => getMat(t, id));
  const t = resolveTex(id); const m = t ? getMat(t, id) : fallbackMat(id);
  return Array(6).fill(m);
}

// ── Geometry builders ────────────────────────────────────────────

// CUBE
function mkCube(id) {
  return new THREE.Mesh(new THREE.BoxGeometry(1,1,1), get6Mats(id));
}

// SLAB — uses props.type: 'bottom' | 'top' | 'double'
function mkSlab(id, props) {
  if (props?.type === 'double') return mkCube(id);
  const m = new THREE.Mesh(new THREE.BoxGeometry(1, 0.5, 1), get6Mats(id));
  m.position.y = props?.type === 'top' ? 0.25 : -0.25;
  return m;
}

// STAIR — uses props.half: 'bottom'|'top', props.facing: 'north'|'south'|'east'|'west'
function mkStair(id, props) {
  const g = new THREE.Group();
  const mats = get6Mats(id);
  const isTop = props?.half === 'top';
  const baseY = isTop ? 0.25 : -0.25;
  const stepY = isTop ? -0.25 : 0.25;
  // Base slab
  g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(1,0.5,1), mats), {position: new THREE.Vector3(0,baseY,0)}));
  // Step — position depends on facing
  const step = new THREE.Mesh(new THREE.BoxGeometry(1,0.5,0.5), mats);
  const facing = props?.facing || 'north';
  const zo = facing === 'south' ? 0.25 : facing === 'north' ? -0.25 :
             facing === 'east'  ? 0 : 0;
  const xo = facing === 'east'  ? 0.25 : facing === 'west' ? -0.25 : 0;
  if (facing === 'east' || facing === 'west') {
    step.geometry = new THREE.BoxGeometry(0.5,0.5,1);
  }
  step.position.set(xo, stepY, zo);
  g.add(step);
  return g;
}

  'potted_dandelion':'dandelion','potted_poppy':'poppy',
  'potted_allium':'allium','potted_azure_bluet':'azure_bluet',
  'potted_fern':'fern','potted_spruce_sapling':'spruce_sapling',
  'potted_birch_sapling':'birch_sapling',
};

function mkXPlane(id) {
  const tex = XPLANE_TEX[id] || resolveTex(id);
  const mat = getMat(tex, id);
  const g = new THREE.Group();
  [-45, 45].forEach(deg => {
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
    mesh.rotation.y = deg * Math.PI / 180;
    g.add(mesh);
  });
  return g;
}

// FLAT — carpet, pressure plate, wire (very thin floor tile)
function mkFlat(id) {
  const t = resolveTex(id);
  const m = t ? getMat(t, id) : fallbackMat(id);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 0.0625, 1), m);
  mesh.position.y = -0.46875;
  return mesh;
}

// TRAPDOOR — thin panel, open or closed, facing-aware
function mkTrapdoor(id, props) {
  const t = resolveTex(id); const m = t ? getMat(t, id) : fallbackMat(id);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 0.1875, 1), m);
  if (props?.open === 'true') {
    // Open — stand vertically against a wall
    mesh.geometry = new THREE.BoxGeometry(1, 1, 0.1875);
    const facing = props?.facing || 'north';
    mesh.position.set(
      facing === 'east' ? 0.40625 : facing === 'west' ? -0.40625 : 0,
      0,
      facing === 'south' ? 0.40625 : facing === 'north' ? -0.40625 : 0,
    );
  } else {
    // Closed — flat panel top or bottom
    mesh.position.y = props?.half === 'top' ? 0.40625 : -0.40625;
  }
  return mesh;
}

// DOOR — full height panel, rendered only for lower half
// top half is skipped in buildScene
function mkDoor(id, props) {
  const topTex  = id.replace('_door','_door_top');
  const botTex  = id.replace('_door','_door_bottom');
  const topMat  = getMat(topTex,  id) || getMat(resolveTex(id), id) || fallbackMat(id);
  const botMat  = getMat(botTex,  id) || getMat(resolveTex(id), id) || fallbackMat(id);
  // 6 faces: right,left,top,bottom,front,back
  const mats = [botMat, botMat, topMat, botMat, botMat, botMat];
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 0.1875), mats);
  // Rotate based on facing
  const facing = props?.facing || 'west';
  mesh.rotation.y = {north:0, south:Math.PI, east:-Math.PI/2, west:Math.PI/2}[facing] || 0;
  mesh.position.y = 0.5; // shift up half because mesh is 2 tall centered at 0
  return mesh;
}

// FENCE — post + rails
function mkFence(id) {
  const t = resolveTex(id); const m = t ? getMat(t, id) : fallbackMat(id);
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.25,1,0.25), m));
  [-0.3,0.2].forEach(y => {
    const r1 = new THREE.Mesh(new THREE.BoxGeometry(1,0.125,0.125), m);
    r1.position.set(0,y,0.3125); g.add(r1);
    const r2 = new THREE.Mesh(new THREE.BoxGeometry(1,0.125,0.125), m);
    r2.position.set(0,y,-0.3125); g.add(r2);
  });
  return g;
}

// WALL — thick post + side connectors
function mkWall(id) {
  const t = resolveTex(id); const m = t ? getMat(t, id) : fallbackMat(id);
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.5,1,0.5), m));
  [1,-1].forEach(d => {
    const rx = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.75,0.375), m);
    rx.position.set(d*0.375,-0.125,0); g.add(rx);
    const rz = new THREE.Mesh(new THREE.BoxGeometry(0.375,0.75,0.5), m);
    rz.position.set(0,-0.125,d*0.375); g.add(rz);
  });
  return g;
}

// LADDER / WALL_SIGN / BANNER — thin panel on wall face
function mkWallPanel(id) {
  const t = resolveTex(id); const m = t ? getMat(t, id) : fallbackMat(id);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.0625), m);
  mesh.position.z = 0.46875;
  return mesh;
}

// PRESSURE PLATE / CARPET — ultra thin floor
function mkPressurePlate(id) {
  const t = resolveTex(id); const m = t ? getMat(t, id) : fallbackMat(id);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.875, 0.0625, 0.875), m);
  mesh.position.y = -0.46875;
  return mesh;
}

// LANTERN — small box (approximation)
function mkLantern(id) {
  const t = resolveTex(id); const m = t ? getMat(t, id) : fallbackMat(id);
  const g = new THREE.Group();
  const box = new THREE.Mesh(new THREE.BoxGeometry(0.375, 0.5, 0.375), m);
  box.position.y = -0.2;
  g.add(box);
  return g;
}

// TORCH — thin stick (approximation)
function mkTorch(id) {
  const t = resolveTex(id); const m = t ? getMat(t, id) : fallbackMat(id);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.125, 0.625, 0.125), m);
  mesh.position.y = -0.1875;
  return mesh;
}

// CANDLE — thin pillar
function mkCandle(id) {
  const t = resolveTex(id) || 'candle';
  const m = getMat(t, id) || fallbackMat(id);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.125, 0.5, 0.125), m);
  mesh.position.y = -0.25;
  return mesh;
}

// BED — low platform
function mkBed(id) {
  const t = resolveTex(id); const m = t ? getMat(t, id) : fallbackMat(id);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 0.5625, 1), m);
  mesh.position.y = -0.21875;
  return mesh;
}

// ── Block shape lookup ───────────────────────────────────────────

// Blocks that are the upper half of a 2-tall structure — skip rendering
const UPPER_HALF_BLOCKS = new Set([
  'spruce_door','dark_oak_door','oak_door','iron_door',
  'birch_door','jungle_door','acacia_door','mangrove_door','cherry_door',
  'tall_grass','large_fern','sunflower','lilac','rose_bush','peony',
]);

// X-plane blocks
const XPLANE_IDS = new Set(Object.keys(XPLANE_TEX));

function makeBlockMesh(id, props) {
  // X-plane (flowers / plants / saplings)
  if (XPLANE_IDS.has(id)) return mkXPlane(id);

  // Shape by block ID suffix / full name
  if (id.endsWith('_slab'))        return mkSlab(id, props);
  if (id.endsWith('_stairs'))      return mkStair(id, props);
  if (id.endsWith('_trapdoor'))    return mkTrapdoor(id, props);
  if (id.endsWith('_door'))        return mkDoor(id, props);
  if (id.endsWith('_fence') || id === 'iron_bars') return mkFence(id);
  if (id.endsWith('_wall'))        return mkWall(id);
  if (id.endsWith('_carpet'))      return mkFlat(id);
  if (id.endsWith('_pressure_plate')) return mkPressurePlate(id);
  if (id.endsWith('_button'))      return mkFlat(id); // tiny, approximate as flat
  if (id.endsWith('_sign'))        return mkWallPanel(id);
  if (id.endsWith('_banner'))      return mkWallPanel(id);
  if (id === 'ladder')             return mkWallPanel(id);
  if (id === 'lantern' || id === 'soul_lantern') return mkLantern(id);
  if (id === 'wall_torch' || id === 'torch') return mkTorch(id);
  if (id === 'candle' || id.endsWith('_candle')) return mkCandle(id);
  if (id === 'redstone_wire')      return mkFlat(id);
  if (id === 'tripwire_hook')      return mkTorch(id); // approximation
  if (id.endsWith('_bed'))         return mkBed(id);
  if (id === 'moss_carpet' || id === 'brown_carpet' || id.endsWith('_carpet')) return mkFlat(id);
  if (id === 'scaffolding')        return mkCube(id); // close enough
  if (id === 'cobweb')             return mkXPlane(id);

  // Default — full cube
  return mkCube(id);
}

// ── Layer system ─────────────────────────────────────────────────
const layerMeshes = {};
let currentLayer  = 0;
let totalLayers   = TOTAL_LAYERS;

function buildScene(data) {
  totalLayers = data.total_layers || TOTAL_LAYERS;

  // Build position lookup for door upper-half detection
  const posSet = new Set(data.blocks.map(b => `${b.x},${b.y},${b.z}`));

  const byLayer = {};
  for (const b of data.blocks) {
    if (!byLayer[b.y]) byLayer[b.y] = [];
    byLayer[b.y].push(b);
  }

  const total = data.blocks.length;
  let done = 0;

  for (const [yStr, blocks] of Object.entries(byLayer)) {
    const y = parseInt(yStr);
    layerMeshes[y] = [];

    for (const b of blocks) {
      const props = b.props || {};

      // Skip upper half of doors (rendered by lower half)
      if (UPPER_HALF_BLOCKS.has(b.id) && props.half === 'upper') {
        done++; continue;
      }

      const mesh = makeBlockMesh(b.id, props);
      mesh.position.set(b.x, b.y, b.z);
      mesh.visible = false;
      scene.add(mesh);
      layerMeshes[y].push(mesh);
      done++;
      loadBar.style.width = `${60 + (done / total) * 40}%`;
    }
  }

  // Center camera on build
  const box = new THREE.Box3();
  for (const b of data.blocks) box.expandByPoint(new THREE.Vector3(b.x, b.y, b.z));
  const center = new THREE.Vector3();
  box.getCenter(center);
  controls.target.set(center.x, center.y, center.z);
  controls.update();
  grid.position.x = center.x;
  grid.position.z = center.z;

  document.getElementById('loading').style.display = 'none';
  showLayer(0);
}

function showLayer(index) {
  if (index < 0 || index >= totalLayers) return;
  currentLayer = index;
  for (const [yStr, meshes] of Object.entries(layerMeshes)) {
    const y = parseInt(yStr);
    const vis = LAYER_MODE === 'cumulative' ? y <= index : y === index;
    for (const m of meshes) m.visible = vis;
  }
  stepEl.textContent = `${index + 1} / ${totalLayers}`;
  document.getElementById('btn-prev').disabled = index === 0;
  document.getElementById('btn-next').disabled = index === totalLayers - 1;
}

document.getElementById('btn-prev').addEventListener('click', () => showLayer(currentLayer - 1));
document.getElementById('btn-next').addEventListener('click', () => showLayer(currentLayer + 1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp')   showLayer(currentLayer + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowDown') showLayer(currentLayer - 1);
});

// ── Load ─────────────────────────────────────────────────────────
async function init() {
  loadTxt.textContent = 'LOADING ATLAS';
  loadBar.style.width = '10%';
  try {
    atlasImg = await new Promise((res, rej) => {
      const i = new Image(); i.crossOrigin = 'Anonymous';
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('atlas failed'));
      i.src = BASE_URL + ATLAS_FILE;
    });
    atlasW = atlasImg.naturalWidth; atlasH = atlasImg.naturalHeight;
    loadBar.style.width = '30%';
  } catch(e) { console.warn('Atlas:', e.message); }

  loadTxt.textContent = 'LOADING MAP';
  try {
    const r = await fetch(BASE_URL + MAP_FILE);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    textureMap = await r.json();
    loadBar.style.width = '55%';
  } catch(e) { console.warn('Map:', e.message); }

  loadTxt.textContent = 'LOADING BLOCKS';
  try {
    const r = await fetch(BASE_URL + DATA_FILE);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    loadBar.style.width = '60%';
    buildScene(data);
  } catch(e) {
    loadTxt.textContent = 'ERROR — CHECK CONSOLE';
    console.error(e);
  }
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

animate();
init();
</script>
