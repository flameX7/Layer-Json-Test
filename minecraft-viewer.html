<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Layer Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; }
  #container { width: 100vw; height: 100vh; position: relative; }

  .arrow-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 16px; z-index: 10;
    transition: opacity 0.2s;
  }
  .arrow-btn:disabled { cursor: not-allowed; }
  .arrow-btn svg { width: 32px; height: 32px; }
  #btn-prev { left: 16px; }
  #btn-next { right: 16px; }

  #step-counter {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-family: sans-serif; font-size: 13px; letter-spacing: 0.1em;
    pointer-events: none; z-index: 10;
  }

  #loading {
    position: absolute; inset: 0; background: transparent;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; z-index: 100;
  }
  #loading-text {
    font-family: sans-serif; font-size: 12px; letter-spacing: 0.15em;
  }
  #loading-bar-outer { width: 160px; height: 2px; background: rgba(255,255,255,0.15); }
  #loading-bar-inner { height: 100%; width: 0%; transition: width 0.3s; }
</style>
</head>
<body>
<div id="container">
  <div id="loading">
    <div id="loading-text">LOADING</div>
    <div id="loading-bar-outer"><div id="loading-bar-inner"></div></div>
  </div>
  <button class="arrow-btn" id="btn-prev" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <button class="arrow-btn" id="btn-next">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>
  <div id="step-counter">1 / 1</div>
</div>

<!-- ================================================================
  THREE.JS — Do not edit
================================================================ -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ================================================================
//  ✏️  SECTION 1 — PROJECT SETTINGS
//  Edit these for every new build
// ================================================================

// Your GitHub Pages base URL — must end with /
const BASE_URL    = 'https://flamex7.github.io/Layer-Json-Test/';

// Your block data JSON file (output from extract_blocks.py)
const DATA_FILE   = 'slime_rocket.json';

// Total number of layers — the extractor script tells you this
const TOTAL_LAYERS = 15;

// Layer display mode:
// 'cumulative' — each step adds a layer on top (like building up)
// 'single'     — shows only the current layer at a time
const LAYER_MODE  = 'cumulative';

// ================================================================
//  ✏️  SECTION 2 — ASSET FILES
//  These should be uploaded to the same GitHub repository
// ================================================================

// Texture atlas image (generated by generate_atlas.py)
const ATLAS_FILE  = 'atlas.png';

// Texture map JSON (generated by generate_atlas.py)
const MAP_FILE    = 'texture_map.json';

// ================================================================
//  ✏️  SECTION 3 — CAMERA
//  Adjust to frame your build nicely
// ================================================================

// Where the camera starts
// x = left/right, y = height, z = distance from build
// Increase z to zoom out for larger builds
const CAM_POS    = { x: 6, y: 8, z: 14 };

// Where the camera looks at (center of your build)
// Increase y if your build is very tall
const CAM_TARGET = { x: 0, y: 2, z: 0  };

// ================================================================
//  ✏️  SECTION 4 — UI COLORS
//  All colors are hex strings e.g. '#ffffff'
//  Opacity is 0.0 (invisible) to 1.0 (fully visible)
// ================================================================

const UI = {
  arrow: {
    color:     '#ffffff',  // ✏️ Arrow color
    opacity:    0.7,       // ✏️ Arrow opacity
    thickness:  1.5,       // ✏️ Arrow stroke thickness in px
  },
  text: {
    color:     '#ffffff',  // ✏️ Step counter color
    opacity:    0.7,       // ✏️ Step counter opacity
  },
  loading: {
    color:     '#ffffff',  // ✏️ Loading bar and text color
    opacity:    0.6,       // ✏️ Loading opacity
  },
  grid: {
    color:     '#ffffff',  // ✏️ Floor grid color
    opacity:    0.12,      // ✏️ Floor grid opacity
  },
};

// ================================================================
//  ✏️  SECTION 5 — BLOCK TEXTURE NAMES
//  Maps block IDs from your JSON to texture names in texture_map.json
//  The key is the block ID from your JSON file
//  The value is the texture file name (without .png extension)
//
//  HOW TO FIND MISSING BLOCK NAMES:
//  1. Open your texture_map.json and search for the block name
//  2. Look inside your mc_textures folder for the PNG file name
//  3. Add the entry here: 'block_id': 'texture_name',
//
//  For Create mod blocks, extract textures from the mod JAR
//  and add them to mc_textures, then regenerate the atlas
// ================================================================

const BLOCK_TEXTURES = {

  // ── Exact mappings for this build's block IDs ──────────────
  // Generated from block_ids.txt — add new blocks as needed

  // Nature & Ground
  'dirt':                         'dirt',
  'grass_block':                  'grass_block_side',
  'stone':                        'stone',
  'cobblestone':                  'cobblestone',
  'cracked_stone_bricks':         'cracked_stone_bricks',
  'stone_bricks':                 'stone_bricks',
  'andesite':                     'andesite',
  'andesite_slab':                'andesite',
  'andesite_stairs':              'andesite',
  'andesite_wall':                'andesite',
  'polished_diorite':             'polished_diorite',
  'polished_diorite_stairs':      'polished_diorite',
  'mud_bricks':                   'mud_bricks',
  'mud_brick_stairs':             'mud_bricks',
  'packed_mud':                   'packed_mud',
  'cobblestone_stairs':           'cobblestone',
  'stone_slab':                   'stone',
  'stone_stairs':                 'stone',
  'cobweb':                       'cobweb',

  // Wood
  'spruce_planks':                'spruce_planks',
  'spruce_slab':                  'spruce_planks',
  'spruce_stairs':                'spruce_planks',
  'spruce_trapdoor':              'spruce_trapdoor',
  'spruce_door':                  'spruce_door_bottom',
  'stripped_spruce_log':          'stripped_spruce_log',
  'dark_oak_leaves':              'dark_oak_leaves',
  'dark_oak_trapdoor':            'dark_oak_trapdoor',
  'dark_oak_slab':                'dark_oak_planks',
  'dark_oak_stairs':              'dark_oak_planks',
  'dark_oak_fence':               'dark_oak_planks',
  'dark_oak_button':              'dark_oak_planks',
  'dark_oak_pressure_plate':      'dark_oak_planks',
  'dark_oak_wall_sign':           'dark_oak_planks',
  'dark_oak_shelf':               'dark_oak_planks',
  'azalea_leaves':                'azalea_leaves',
  'flowering_azalea_leaves':      'flowering_azalea_leaves',

  // Plants & Flowers
  'allium':                       'allium',
  'azure_bluet':                  'azure_bluet',
  'blue_orchid':                  'blue_orchid',
  'lily_of_the_valley':           'lily_of_the_valley',
  'white_tulip':                  'white_tulip',
  'moss_carpet':                  'moss_block',
  'brown_carpet':                 'brown_wool',
  'flower_pot':                   'flower_pot',
  'potted_azalea_bush':           'potted_azalea_bush_side',
  'potted_cornflower':            'cornflower',
  'potted_dark_oak_sapling':      'dark_oak_sapling',
  'potted_flowering_azalea_bush': 'potted_flowering_azalea_bush_side',
  'potted_lily_of_the_valley':    'lily_of_the_valley',
  'potted_oak_sapling':           'oak_sapling',

  // Storage & Utility
  'chest':                        'oak_planks',
  'ender_chest':                  'ender_chest',
  'barrel':                       'barrel_side',
  'furnace':                      'furnace_front',
  'blast_furnace':                'blast_furnace_front',
  'smoker':                       'smoker_front',
  'crafting_table':               'crafting_table_front',
  'cartography_table':            'cartography_table_side1',
  'smithing_table':               'smithing_table_front',
  'stonecutter':                  'stonecutter_bottom',
  'grindstone':                   'grindstone_side',
  'loom':                         'loom_front',
  'jukebox':                      'jukebox_side',
  'chiseled_bookshelf':           'chiseled_bookshelf_empty',
  'decorated_pot':                'decorated_pot_side',
  'anvil':                        'anvil_top',
  'campfire':                     'campfire_log',

  // Glass & Light
  'lantern':                      'lantern',
  'soul_lantern':                 'soul_lantern',
  'wall_torch':                   'torch',
  'candle':                       'candle',
  'light_gray_stained_glass_pane':'light_gray_stained_glass',

  // Misc
  'redstone_wire':                'redstone_dust_dot',
  'tripwire_hook':                'tripwire_hook',
  'ladder':                       'ladder',
  'scaffolding':                  'scaffolding_side',
  'iron_bars':                    'iron_bars',
  'brown_mushroom_block':         'brown_mushroom_block',
  'skeleton_skull':               'skeleton',
  'heavy_weighted_pressure_plate':'iron_block',
  'pale_oak_button':              'oak_planks',
  'water_cauldron':               'cauldron_inner',
  'white_bed':                    'white_wool',
  'light_blue_wall_banner':       'white_wool',

  // ✏️ ADD MORE BLOCKS HERE as needed
  // Format: 'block_id': 'texture_name_from_atlas',

  // ✏️ CREATE MOD BLOCKS
  // 1. Extract textures from create-xxx.jar → assets/create/textures/block/
  // 2. Copy PNGs into mc_textures folder
  // 3. Re-run generate_atlas.py
  // 4. Add entries below:
  // 'create/cogwheel':         'cogwheel',
  // 'create/shaft':            'shaft',
  // 'create/andesite_casing':  'andesite_casing',
};

// ================================================================
//  ⚙️  ENGINE — No need to edit below this line
// ================================================================

// Apply UI colors
document.querySelectorAll('.arrow-btn svg').forEach(svg => {
  svg.setAttribute('stroke', UI.arrow.color);
  svg.setAttribute('stroke-width', UI.arrow.thickness);
  svg.style.opacity = UI.arrow.opacity;
});
const stepCounter = document.getElementById('step-counter');
stepCounter.style.color    = UI.text.color;
stepCounter.style.opacity  = UI.text.opacity;
const loadingText = document.getElementById('loading-text');
loadingText.style.color    = UI.loading.color;
loadingText.style.opacity  = UI.loading.opacity;
const loadingBar = document.getElementById('loading-bar-inner');
loadingBar.style.background = UI.loading.color;

// Renderer
const container = document.getElementById('container');
const renderer  = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// Scene
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(CAM_POS.x, CAM_POS.y, CAM_POS.z);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping  = true;
controls.dampingFactor  = 0.08;
controls.minDistance    = 2;
controls.maxDistance    = 80;
controls.target.set(CAM_TARGET.x, CAM_TARGET.y, CAM_TARGET.z);
controls.update();

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(10, 20, 10);
sun.castShadow = true;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xaabbff, 0.2);
fill.position.set(-10, 5, -10);
scene.add(fill);

// Grid floor
const gc = new THREE.Color(UI.grid.color);
const grid = new THREE.GridHelper(32, 32, gc, gc);
grid.material.transparent = true;
grid.material.opacity     = UI.grid.opacity;
grid.position.y           = -0.01;
scene.add(grid);

// ── Atlas & Material System ──────────────────────────────────────
let atlasTexture = null;
let textureMap   = null;
let atlasW = 1, atlasH = 1;

// Cache: blockId → { geometry, material }
const blockCache = new Map();

// Shared base geometry — cloned per unique block type
const BASE_GEO = new THREE.BoxGeometry(1, 1, 1);

function resolveTextureName(blockId) {
  // 1. Check BLOCK_TEXTURES map first
  if (BLOCK_TEXTURES[blockId]) return BLOCK_TEXTURES[blockId];

  // 2. Try the block ID directly (e.g. 'stone' matches 'stone' in atlas)
  if (textureMap && textureMap[blockId]) return blockId;

  // 3. Try stripping namespace prefix
  //    e.g. 'minecraft:stone' → 'stone'
  //    e.g. 'create/cogwheel' → 'cogwheel'
  const stripped = blockId.split(':').pop().split('/').pop();
  if (textureMap && textureMap[stripped]) return stripped;

  // 4. No match found
  return null;
}

function makeUVGeometry(texName) {
  const rect = textureMap[texName];
  if (!rect) return BASE_GEO.clone();

  const geo  = BASE_GEO.clone();
  const uvAttr = geo.attributes.uv;
  const arr  = uvAttr.array;

  // Convert pixel coords to normalized UV
  const u1 = rect.u / atlasW;
  const u2 = (rect.u + rect.w) / atlasW;
  // Flip V axis: Three.js UV origin is bottom-left, image origin is top-left
  const v2 = 1.0 - (rect.v / atlasH);
  const v1 = 1.0 - ((rect.v + rect.h) / atlasH);

  // Remap every UV coordinate to point at this tile in the atlas
  for (let i = 0; i < arr.length; i += 2) {
    arr[i]     = u1 + arr[i]     * (u2 - u1);
    arr[i + 1] = v1 + arr[i + 1] * (v2 - v1);
  }
  uvAttr.needsUpdate = true;
  return geo;
}

function makeFallbackMaterial(blockId) {
  // Generate a unique deterministic color per block type
  let hash = 0;
  for (let i = 0; i < blockId.length; i++) {
    hash = ((hash << 5) - hash) + blockId.charCodeAt(i);
  }
  const color = new THREE.Color().setHSL(Math.abs(hash % 360) / 360, 0.45, 0.5);
  return new THREE.MeshLambertMaterial({ color });
}

function getBlockMesh(blockId) {
  // Return cached data if already processed this block type
  if (blockCache.has(blockId)) {
    const c = blockCache.get(blockId);
    return new THREE.Mesh(c.geo, c.mat);
  }

  let geo, mat;

  if (atlasTexture && textureMap) {
    const texName = resolveTextureName(blockId);
    if (texName) {
      geo = makeUVGeometry(texName);
      mat = new THREE.MeshLambertMaterial({
        map:       atlasTexture,
        alphaTest: 0.1,
      });
    } else {
      // Block not in atlas — use unique fallback color
      geo = BASE_GEO.clone();
      mat = makeFallbackMaterial(blockId);
    }
  } else {
    // Atlas not loaded — use fallback colors for everything
    geo = BASE_GEO.clone();
    mat = makeFallbackMaterial(blockId);
  }

  blockCache.set(blockId, { geo, mat });
  return new THREE.Mesh(geo, mat);
}

// ── Layer System ─────────────────────────────────────────────────
const layerMeshes = {};
let currentLayer  = 0;
let totalLayers   = TOTAL_LAYERS;

function buildScene(data) {
  totalLayers = data.total_layers || TOTAL_LAYERS;

  // Group blocks by Y level
  const byLayer = {};
  for (const block of data.blocks) {
    if (!byLayer[block.y]) byLayer[block.y] = [];
    byLayer[block.y].push(block);
  }

  const total = data.blocks.length;
  let done = 0;

  for (const [yStr, blocks] of Object.entries(byLayer)) {
    const y = parseInt(yStr);
    layerMeshes[y] = [];
    for (const block of blocks) {
      const mesh = getBlockMesh(block.id);
      mesh.position.set(block.x, block.y, block.z);
      mesh.castShadow    = true;
      mesh.receiveShadow = true;
      mesh.visible       = false;
      scene.add(mesh);
      layerMeshes[y].push(mesh);
      done++;
      loadingBar.style.width = `${60 + (done / total) * 40}%`;
    }
  }

  // Auto-center camera on the build
  const box = new THREE.Box3();
  for (const b of data.blocks) box.expandByPoint(new THREE.Vector3(b.x, b.y, b.z));
  const center = new THREE.Vector3();
  box.getCenter(center);
  controls.target.set(center.x, center.y, center.z);
  controls.update();
  grid.position.x = center.x;
  grid.position.z = center.z;

  document.getElementById('loading').style.display = 'none';
  showLayer(0);
}

function showLayer(index) {
  if (index < 0 || index >= totalLayers) return;
  currentLayer = index;

  for (const [yStr, meshes] of Object.entries(layerMeshes)) {
    const y       = parseInt(yStr);
    const visible = LAYER_MODE === 'cumulative' ? y <= index : y === index;
    for (const mesh of meshes) mesh.visible = visible;
  }

  stepCounter.textContent = `${index + 1} / ${totalLayers}`;
  document.getElementById('btn-prev').disabled = index === 0;
  document.getElementById('btn-next').disabled = index === totalLayers - 1;
}

// Controls
document.getElementById('btn-prev').addEventListener('click', () => showLayer(currentLayer - 1));
document.getElementById('btn-next').addEventListener('click', () => showLayer(currentLayer + 1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp')   showLayer(currentLayer + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowDown') showLayer(currentLayer - 1);
});

// ── Load Everything ──────────────────────────────────────────────
async function init() {
  // Step 1 — Load texture atlas
  loadingText.textContent = 'LOADING ATLAS';
  loadingBar.style.width  = '10%';
  try {
    const img = await new Promise((resolve, reject) => {
      const i       = new Image();
      i.crossOrigin = 'Anonymous';
      i.onload      = () => resolve(i);
      i.onerror     = () => reject(new Error('Atlas failed to load'));
      i.src         = BASE_URL + ATLAS_FILE;
    });
    atlasTexture            = new THREE.Texture(img);
    atlasTexture.magFilter  = THREE.NearestFilter;
    atlasTexture.minFilter  = THREE.NearestFilter;
    atlasTexture.needsUpdate = true;
    atlasW = img.naturalWidth;
    atlasH = img.naturalHeight;
    loadingBar.style.width  = '30%';
  } catch (e) {
    console.warn('Atlas not loaded — using fallback colors:', e.message);
  }

  // Step 2 — Load texture map
  loadingText.textContent = 'LOADING MAP';
  try {
    const res = await fetch(BASE_URL + MAP_FILE);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    textureMap             = await res.json();
    loadingBar.style.width = '55%';
  } catch (e) {
    console.warn('Texture map not loaded — using fallback colors:', e.message);
  }

  // Step 3 — Load block data
  loadingText.textContent = 'LOADING BLOCKS';
  try {
    const res = await fetch(BASE_URL + DATA_FILE);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data             = await res.json();
    loadingBar.style.width = '60%';
    buildScene(data);
  } catch (e) {
    loadingText.textContent = 'ERROR — CHECK CONSOLE';
    console.error('Block data failed:', e);
  }
}

// ── Render Loop ──────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

animate();
init();
</script>
</body>
</html>
