<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Layer Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; }
  #container { width: 100vw; height: 100vh; position: relative; }

  .arrow-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 16px; z-index: 10;
    transition: opacity 0.2s;
  }
  .arrow-btn:disabled { cursor: not-allowed; }
  .arrow-btn svg { width: 32px; height: 32px; }
  #btn-prev { left: 16px; }
  #btn-next { right: 16px; }

  #step-counter {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-family: sans-serif; font-size: 13px; letter-spacing: 0.1em;
    pointer-events: none; z-index: 10;
  }

  #loading {
    position: absolute; inset: 0; background: transparent;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; z-index: 100;
  }
  #loading-text {
    font-family: sans-serif; font-size: 12px; letter-spacing: 0.15em;
  }
  #loading-bar-outer { width: 160px; height: 2px; background: rgba(255,255,255,0.15); }
  #loading-bar-inner { height: 100%; width: 0%; transition: width 0.3s; }
</style>
</head>
<body>
<div id="container">
  <div id="loading">
    <div id="loading-text">LOADING</div>
    <div id="loading-bar-outer"><div id="loading-bar-inner"></div></div>
  </div>
  <button class="arrow-btn" id="btn-prev" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <button class="arrow-btn" id="btn-next">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>
  <div id="step-counter">1 / 1</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">

  'smithing_table':               'smithing_table_front',
  'stonecutter':                  'stonecutter_bottom',
  'grindstone':                   'grindstone_side',
  'loom':                         'loom_front',
  'jukebox':                      'jukebox_side',
  'chiseled_bookshelf':           'chiseled_bookshelf_empty',
  'decorated_pot':                'decorated_pot_side',
  'anvil':                        'anvil_top',
  'campfire':                     'campfire_log',
  'lantern':                      'lantern',
  'soul_lantern':                 'soul_lantern',
  'wall_torch':                   'torch',
  'candle':                       'candle',
  'light_gray_stained_glass_pane':'light_gray_stained_glass',
  'redstone_wire':                'redstone_dust_dot',
  'tripwire_hook':                'tripwire_hook',
  'ladder':                       'ladder',
  'scaffolding':                  'scaffolding_side',
  'iron_bars':                    'iron_bars',
  'brown_mushroom_block':         'brown_mushroom_block',
  'skeleton_skull':               'skeleton',
  'heavy_weighted_pressure_plate':'iron_block',
  'pale_oak_button':              'oak_planks',
  'water_cauldron':               'cauldron_inner',
  'white_bed':                    'white_wool',
  'light_blue_wall_banner':       'white_wool',
};

// ================================================================
//  ⚙️ ENGINE
// ================================================================

document.querySelectorAll('.arrow-btn svg').forEach(svg => {
  svg.setAttribute('stroke', UI.arrow.color);
  svg.setAttribute('stroke-width', UI.arrow.thickness);
  svg.style.opacity = UI.arrow.opacity;
});
const stepCounter = document.getElementById('step-counter');
stepCounter.style.color    = UI.text.color;
stepCounter.style.opacity  = UI.text.opacity;
const loadingText = document.getElementById('loading-text');
loadingText.style.color    = UI.loading.color;
loadingText.style.opacity  = UI.loading.opacity;
const loadingBar = document.getElementById('loading-bar-inner');
loadingBar.style.background = UI.loading.color;

const container = document.getElementById('container');
const renderer  = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(CAM_POS.x, CAM_POS.y, CAM_POS.z);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping  = true;
controls.dampingFactor  = 0.08;
controls.minDistance    = 2;
controls.maxDistance    = 80;
controls.target.set(CAM_TARGET.x, CAM_TARGET.y, CAM_TARGET.z);
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(1, 2, 1);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8899bb, 0.3);
fill.position.set(-1, -1, -1);
scene.add(fill);

const gc = new THREE.Color(UI.grid.color);
const grid = new THREE.GridHelper(32, 32, gc, gc);
grid.material.transparent = true;
grid.material.opacity     = UI.grid.opacity;
grid.position.y           = -0.01;
scene.add(grid);

let atlasTexture = null;
let textureMap   = null;
let atlasW = 1, atlasH = 1;

const blockCache = new Map();
const texCache   = new Map();

const FACE_TEXTURES = {
  'grass_block':         ['grass_block_side','grass_block_side','grass_block_top','dirt','grass_block_side','grass_block_side'],
  'podzol':              ['podzol_side','podzol_side','podzol_top','dirt','podzol_side','podzol_side'],
  'mycelium':            ['mycelium_side','mycelium_side','mycelium_top','dirt','mycelium_side','mycelium_side'],
  'stripped_spruce_log': ['stripped_spruce_log','stripped_spruce_log','stripped_spruce_log_top','stripped_spruce_log_top','stripped_spruce_log','stripped_spruce_log'],
  'spruce_log':          ['spruce_log','spruce_log','spruce_log_top','spruce_log_top','spruce_log','spruce_log'],
  'oak_log':             ['oak_log','oak_log','oak_log_top','oak_log_top','oak_log','oak_log'],
  'dark_oak_log':        ['dark_oak_log','dark_oak_log','dark_oak_log_top','dark_oak_log_top','dark_oak_log','dark_oak_log'],
  'birch_log':           ['birch_log','birch_log','birch_log_top','birch_log_top','birch_log','birch_log'],
  'jungle_log':          ['jungle_log','jungle_log','jungle_log_top','jungle_log_top','jungle_log','jungle_log'],
  'acacia_log':          ['acacia_log','acacia_log','acacia_log_top','acacia_log_top','acacia_log','acacia_log'],
  'mangrove_log':        ['mangrove_log','mangrove_log','mangrove_log_top','mangrove_log_top','mangrove_log','mangrove_log'],
  'furnace':             ['furnace_side','furnace_side','furnace_top','furnace_top','furnace_front','furnace_side'],
  'blast_furnace':       ['blast_furnace_side','blast_furnace_side','blast_furnace_top','blast_furnace_top','blast_furnace_front','blast_furnace_side'],
  'smoker':              ['smoker_side','smoker_side','smoker_top','smoker_bottom','smoker_front','smoker_side'],
  'crafting_table':      ['crafting_table_side','crafting_table_side','crafting_table_top','oak_planks','crafting_table_front','crafting_table_front'],
  'cartography_table':   ['cartography_table_side2','cartography_table_side3','cartography_table_top','oak_planks','cartography_table_side1','cartography_table_side2'],
  'smithing_table':      ['smithing_table_side','smithing_table_side','smithing_table_top','smithing_table_bottom','smithing_table_front','smithing_table_front'],
  'loom':                ['loom_side','loom_side','loom_top','loom_bottom','loom_front','loom_side'],
  'barrel':              ['barrel_side','barrel_side','barrel_top','barrel_bottom','barrel_side','barrel_side'],
  'stonecutter':         ['stonecutter_side','stonecutter_side','stonecutter_top','stonecutter_bottom','stonecutter_side','stonecutter_side'],
  'jukebox':             ['jukebox_side','jukebox_side','jukebox_top','jukebox_side','jukebox_side','jukebox_side'],
  'chiseled_bookshelf':  ['chiseled_bookshelf_side','chiseled_bookshelf_side','chiseled_bookshelf_top','chiseled_bookshelf_top','chiseled_bookshelf_empty','chiseled_bookshelf_side'],
  'campfire':            ['campfire_log','campfire_log','campfire_fire','campfire_log','campfire_log','campfire_log'],
  'anvil':               ['anvil','anvil','anvil_top','anvil','anvil','anvil'],
  'scaffolding':         ['scaffolding_side','scaffolding_side','scaffolding_top','scaffolding_bottom','scaffolding_side','scaffolding_side'],
};

function makeAtlasMaterial(texName) {
  if (texCache.has(texName)) return texCache.get(texName);

  const rect = textureMap[texName];
  if (!rect || !atlasTexture) return null;

  const canvas = document.createElement('canvas');
  canvas.width  = rect.w;
  canvas.height = rect.h;
  const ctx = canvas.getContext('2d');
  
  ctx.drawImage(
    atlasTexture.image,
    rect.u, rect.v, rect.w, rect.h,
    0, 0, rect.w, rect.h
  );

  // FIX FOR BLACK BACKGROUND ALPHA TEXTURES:
  // Since atlas.jpg does not natively possess alpha, black colors (RGB 0,0,0) must act as transparent channels.
  const imgData = ctx.getImageData(0, 0, rect.w, rect.h);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i] <= 12 && d[i+1] <= 12 && d[i+2] <= 12) { 
      d[i+3] = 0; // Turn black areas transparent
    }
  }
  ctx.putImageData(imgData, 0, 0);

  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter  = THREE.NearestFilter;
  tex.minFilter  = THREE.NearestFilter;
  tex.colorSpace = THREE.SRGBColorSpace; // Keeps colors vivid and mathematically matched
  tex.needsUpdate = true;

  const mat = new THREE.MeshLambertMaterial({
    map:         tex,
    transparent: true,
    alphaTest:   0.05,
    side:        THREE.DoubleSide
  });

  texCache.set(texName, mat);
  return mat;
}

function resolveTex(blockId) {
  if (BLOCK_TEXTURES[blockId]) return BLOCK_TEXTURES[blockId];
  if (textureMap && textureMap[blockId]) return blockId;
  const stripped = blockId.split(':').pop().split('/').pop();
  if (textureMap && textureMap[stripped]) return stripped;
  return null;
}

function makeFallbackMaterial(blockId) {
  let hash = 0;
  for (let i = 0; i < blockId.length; i++) hash = ((hash << 5) - hash) + blockId.charCodeAt(i);
  const color = new THREE.Color().setHSL(Math.abs(hash % 360) / 360, 0.45, 0.55);
  return new THREE.MeshLambertMaterial({ color, side: THREE.DoubleSide });
}

// FIX FOR FLATTENED / INCORRECT GEOMETRIES:
// Generates compound meshes for Slabs, Stairs, Walls, Torches, Crosses instead of uniform cubes.
function getBlockGeometryAndMaterials(blockId) {
  if (blockCache.has(blockId)) return blockCache.get(blockId);

  // Determine standard texture references
  let mats;
  const faceDef = FACE_TEXTURES[blockId];
  if (faceDef) {
    mats = faceDef.map(name => makeAtlasMaterial(name) || makeFallbackMaterial(blockId));
  } else {
    const texName = resolveTex(blockId);
    const m = texName ? makeAtlasMaterial(texName) : makeFallbackMaterial(blockId);
    mats = Array(6).fill(m || makeFallbackMaterial(blockId));
  }

  // Define geometric variation logic based on block IDs
  if (blockId.includes('slab')) {
    const geo = new THREE.BoxGeometry(1, 0.5, 1);
    geo.translate(0, -0.25, 0); // Position at the bottom half of the block matrix grid space
    const group = { geo, mats, isCompound: false };
    blockCache.set(blockId, group);
    return group;
  } 
  else if (blockId.includes('stairs')) {
    // Combine base plate and upper missing step using a merged geometry
    const base = new THREE.BoxGeometry(1, 0.5, 1);
    base.translate(0, -0.25, 0);
    const topStep = new THREE.BoxGeometry(1, 0.5, 0.5);
    topStep.translate(0, 0.25, 0.25);
    
    const geo = THREE.BufferGeometryUtils ? THREE.BufferGeometryUtils.mergeGeometries([base, topStep]) : new THREE.BoxGeometry(1,1,1);
    const group = { geo, mats, isCompound: false };
    blockCache.set(blockId, group);
    return group;
  }
  else if (blockId.includes('wall') || blockId.includes('fence')) {
    const geo = new THREE.BoxGeometry(0.5, 1, 0.5);
    const group = { geo, mats, isCompound: false };
    blockCache.set(blockId, group);
    return group;
  }
  else if (blockId.includes('torch')) {
    const geo = new THREE.BoxGeometry(0.125, 0.625, 0.125);
    geo.translate(0, -0.1875, 0);
    const group = { geo, mats, isCompound: false };
    blockCache.set(blockId, group);
    return group;
  }
  else if (blockId.includes('sapling') || blockId.includes('allium') || blockId.includes('bluet') || 
           blockId.includes('orchid') || blockId.includes('valley') || blockId.includes('tulip') || 
           blockId.includes('bush') || blockId.includes('cornflower') || blockId === 'cobweb' || blockId.includes('flower')) {
    // Render intersection crosses (like plants/webs) using two intersecting panels
    const p1 = new THREE.PlaneGeometry(1, 1);
    p1.rotateY(Math.PI / 4);
    const p2 = new THREE.PlaneGeometry(1, 1);
    p2.rotateY(-Math.PI / 4);
    
    const geo = THREE.BufferGeometryUtils ? THREE.BufferGeometryUtils.mergeGeometries([p1, p2]) : new THREE.BoxGeometry(1,1,1);
    const singleMat = mats[4]; // Extract standard single side face texture
    const group = { geo, mats: singleMat, isCompound: true };
    blockCache.set(blockId, group);
    return group;
  }
  else {
    // Normal solid block configuration
    const geo = new THREE.BoxGeometry(1, 1, 1);
    const group = { geo, mats, isCompound: false };
    blockCache.set(blockId, group);
    return group;
  }
}

function getBlockMesh(blockId) {
  const data = getBlockGeometryAndMaterials(blockId);
  return new THREE.Mesh(data.geo, data.mats);
}

// ── Layer System ────────────────=================================
const layerMeshes = {};
let currentLayer  = 0;
let totalLayers   = TOTAL_LAYERS;

function buildScene(data) {
  totalLayers = data.total_layers || TOTAL_LAYERS;

  const byLayer = {};
  for (const block of data.blocks) {
    if (!byLayer[block.y]) byLayer[block.y] = [];
    byLayer[block.y].push(block);
  }

  const total = data.blocks.length;
  let done = 0;

  for (const [yStr, blocks] of Object.entries(byLayer)) {
    const y = parseInt(yStr);
    layerMeshes[y] = [];
    for (const block of blocks) {
      const mesh = getBlockMesh(block.id);
      mesh.position.set(block.x, block.y, block.z);
      mesh.visible = false;
      scene.add(mesh);
      layerMeshes[y].push(mesh);
      done++;
      loadingBar.style.width = `${60 + (done / total) * 40}%`;
    }
  }

  const box = new THREE.Box3();
  for (const b of data.blocks) box.expandByPoint(new THREE.Vector3(b.x, b.y, b.z));
  const center = new THREE.Vector3();
  box.getCenter(center);
  controls.target.set(center.x, center.y, center.z);
  controls.update();
  grid.position.x = center.x;
  grid.position.z = center.z;

  document.getElementById('loading').style.display = 'none';
  showLayer(0);
}

function showLayer(index) {
  if (index < 0 || index >= totalLayers) return;
  currentLayer = index;

  for (const [yStr, meshes] of Object.entries(layerMeshes)) {
    const y       = parseInt(yStr);
    const visible = LAYER_MODE === 'cumulative' ? y <= index : y === index;
    for (const mesh of meshes) mesh.visible = visible;
  }

  stepCounter.textContent = `${index + 1} / ${totalLayers}`;
  document.getElementById('btn-prev').disabled = index === 0;
  document.getElementById('btn-next').disabled = index === totalLayers - 1;
}

document.getElementById('btn-prev').addEventListener('click', () => showLayer(currentLayer - 1));
document.getElementById('btn-next').addEventListener('click', () => showLayer(currentLayer + 1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp')   showLayer(currentLayer + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowDown') showLayer(currentLayer - 1);
});

// ── Load Everything ──────────────────────────────────────────────
async function init() {
  // Explicitly inject BufferGeometryUtils globally just in case the addon import missed it
  try {
    const { BufferGeometryUtils } = await import('three/addons/utils/BufferGeometryUtils.js');
    THREE.BufferGeometryUtils = BufferGeometryUtils;
  } catch(e) {
    console.warn("BufferGeometryUtils could not be initialized:", e.message);
  }

  loadingText.textContent = 'LOADING ATLAS';
  loadingBar.style.width  = '10%';
  try {
    const img = await new Promise((resolve, reject) => {
      const i       = new Image();
      // Only apply anonymous CORS rules if loading from a remote URL (like GitHub Pages)
      if (BASE_URL.startsWith('http')) {
        i.crossOrigin = 'Anonymous';
      }
      i.onload      = () => resolve(i);
      i.onerror     = (err) => reject(new Error('Atlas image file could not be read. Check file path or local server.'));
      
      // If previewing locally on your computer, use a relative path instead of BASE_URL
      i.src         = BASE_URL.startsWith('http') ? BASE_URL + ATLAS_FILE : ATLAS_FILE;
    });
    
    atlasTexture            = new THREE.Texture(img);
    atlasTexture.magFilter  = THREE.NearestFilter;
    atlasTexture.minFilter  = THREE.NearestFilter;
    atlasTexture.needsUpdate = true;
    atlasW = img.naturalWidth;
    atlasH = img.naturalHeight;
    loadingBar.style.width  = '30%';
  } catch (e) {
    alert("Texture Error: " + e.message + "\n\nIf you are double-clicking the HTML file from your desktop, browsers block texture loading for security. Run a local server (like Live Server in VS Code) to view it locally!");
    console.warn('Atlas not loaded — using fallback colors:', e.message);
  }

  loadingText.textContent = 'LOADING MAP';
  try {
    const mapUrl = BASE_URL.startsWith('http') ? BASE_URL + MAP_FILE : MAP_FILE;
    const res = await fetch(mapUrl);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    textureMap             = await res.json();
    loadingBar.style.width = '55%';
  } catch (e) {
    console.warn('Texture map not loaded — using fallback colors:', e.message);
  }

  loadingText.textContent = 'LOADING BLOCKS';
  try {
    const dataUrl = BASE_URL.startsWith('http') ? BASE_URL + DATA_FILE : DATA_FILE;
    const res = await fetch(dataUrl);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data             = await res.json();
    loadingBar.style.width = '60%';
    buildScene(data);
  } catch (e) {
    loadingText.textContent = 'ERROR — CHECK CONSOLE';
    console.error('Block data failed:', e);
  }
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

animate();
init();
</script>
</body>
</html>
